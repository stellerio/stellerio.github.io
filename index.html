<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STELLARIO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Inter,Arial;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-50%;background:radial-gradient(circle,#fff1,transparent 22%),radial-gradient(circle,#8883,transparent 35%);animation:bg 18s infinite alternate;z-index:-1}
.app{min-height:100vh;display:flex}.main{flex:1;padding:45px}.hero{text-align:center;padding-top:25px}
.title{font-size:clamp(55px,8vw,110px);letter-spacing:12px;font-weight:950;background:linear-gradient(90deg,#fff,#aaa,#eee,#666,#fff);background-size:300%;background-clip:text;color:transparent;animation:shine 6s infinite linear,appear 2s, float 4s infinite}
.typing{font-size:22px;color:#aaa;border-right:2px solid #fff;width:max-content;margin:auto;overflow:hidden;white-space:nowrap;animation:type 3s steps(35)}
.search{margin:45px auto;width:min(700px,90%);padding:18px 25px;border-radius:30px;background:#ffffff10;border:1px solid #ffffff25;color:white;font-size:17px;outline:none;backdrop-filter:blur(20px)}
.sidebar{width:330px;background:#080808dd;border-left:1px solid #ffffff20;padding:25px;backdrop-filter:blur(30px)}
.logo{font-size:25px;font-weight:800;margin-bottom:25px}.gameBtn{display:flex;width:100%;align-items:center;gap:15px;padding:18px;margin:12px 0;border-radius:18px;background:#ffffff08;border:1px solid #ffffff18;color:#fff;cursor:pointer;transition:.35s}.gameBtn:hover{transform:translateX(-12px);background:#fff2}
svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2}
.viewer{display:none;height:620px;margin:40px auto;border-radius:35px;background:#030303;border:1px solid #ffffff25;box-shadow:0 0 100px #fff2;align-items:center;justify-content:center;font-size:28px;color:#888;animation:open .6s}
.viewer.active{display:flex}.features{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}.card{padding:25px;border-radius:25px;background:#ffffff0b;border:1px solid #fff2;animation:float 5s infinite}.card:hover{transform:translateY(-10px)}
@keyframes shine{to{background-position:300%}}@keyframes bg{to{transform:scale(1.25)}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes open{from{opacity:0;transform:scale(.8)}}@keyframes type{from{width:0}}
</style></head>
<body><div class="app"><main class="main"><section class="hero"><h1 class="title">STELLARIO</h1><div class="typing">Your online gaming universe.</div><input class="search" placeholder="Search games..."></section><div id="viewer" class="viewer">Select a game from the library</div><div class="features"><div class="card">Game Library</div><div class="card">Fast Launch</div><div class="card">Modern Design</div></div></main><aside class="sidebar"><div class="logo">STELLARIO</div><button class="gameBtn" onclick="openGame('Game One')"><svg viewBox="0 0 24 24"><path d="M4 8h16v10H4z"/></svg>Game One</button><button class="gameBtn" onclick="openGame('Game Two')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>Game Two</button><button class="gameBtn" onclick="openGame('Game Three')"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg>Game Three</button></aside></div><script>function openGame(n){let v=document.getElementById('viewer');v.classList.add('active');v.innerHTML=n+'<br><br>GAME EMBED AREA<br>URL NOT SET';}</script></body></html>
