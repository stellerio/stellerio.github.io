<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steller AI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #000;
    --border: #1a1a1a;
    --text: #fff;
    --muted: #555;
    --user-bg: #111;
    --user-border: #2a2a2a;
    --input-bg: #0d0d0d;
    --input-border: #2a2a2a;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; overflow: hidden; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  #c0 { z-index: 0; } #c1 { z-index: 1; } #c2 { z-index: 2; }
  #app { position: relative; z-index: 10; display: flex; flex-direction: column; height: 100vh; }
  header {
    padding: 18px 28px; border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.75); backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  header h1 { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: .35em; text-transform: uppercase; }
  header h1 span { color: var(--muted); }
  #chatbox {
    flex: 1; overflow-y: auto; padding: 40px 28px 20px;
    display: flex; flex-direction: column; gap: 26px;
    scrollbar-width: thin; scrollbar-color: #1a1a1a transparent;
    max-width: 860px; width: 100%; margin: 0 auto; align-self: center;
  }
  #chatbox::-webkit-scrollbar { width: 3px; }
  #chatbox::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 2px; }
  .msg-row { display: flex; animation: msgIn .3s cubic-bezier(.16,1,.3,1) both; opacity: 0; }
  @keyframes msgIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.bot  { justify-content: flex-start; }
  .user .bubble {
    background: var(--user-bg); border: 1px solid var(--user-border);
    padding: 11px 17px; border-radius: 18px 18px 4px 18px;
    max-width: 70%; font-size: 15px; line-height: 1.65; word-break: break-word;
  }
  .bot .bubble {
    background: transparent; border: none; padding: 0;
    max-width: 86%; font-size: 15px; line-height: 1.8; word-break: break-word;
  }
  .user .bubble img { max-width: 180px; max-height: 180px; border-radius: 10px; display: block; margin-bottom: 6px; object-fit: cover; border: 1px solid var(--border); }
  .typing-bub { display: flex; align-items: center; gap: 5px; height: 24px; }
  .dot { width: 5px; height: 5px; background: #444; border-radius: 50%; animation: dotP 1.4s infinite; }
  .dot:nth-child(2) { animation-delay: .2s; } .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes dotP { 0%,80%,100%{opacity:.2;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }
  .tcursor::after { content:'▋'; animation: blink .6s step-end infinite; color:#444; font-size:12px; margin-left:1px; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .bot .bubble pre { background:#0c0c0c; border:1px solid #1e1e1e; border-radius:10px; padding:14px 16px; margin:10px 0; overflow-x:auto; font-family:'Space Mono',monospace; font-size:13px; color:#ccc; line-height:1.6; }
  .bot .bubble code { font-family:'Space Mono',monospace; font-size:13px; background:#111; padding:1px 5px; border-radius:4px; color:#bbb; }
  .bot .bubble pre code { background:transparent; padding:0; }
  #inputArea { flex-shrink:0; padding:14px 28px 22px; background:rgba(0,0,0,.8); backdrop-filter:blur(20px); border-top:1px solid var(--border); }
  #imgPreviewWrap { display:none; max-width:800px; margin:0 auto 10px; align-items:flex-start; gap:8px; }
  #imgPreviewWrap.visible { display:flex; }
  #imgPreview { max-height:72px; max-width:110px; border-radius:8px; border:1px solid var(--border); object-fit:cover; }
  #removeImg { background:#1a1a1a; border:1px solid #2a2a2a; color:#666; border-radius:50%; width:20px; height:20px; cursor:pointer; font-size:10px; display:flex; align-items:center; justify-content:center; transition:color .15s; flex-shrink:0; }
  #removeImg:hover { color:#fff; }
  #fileInput { display:none; }
  #inputWrap { display:flex; align-items:center; gap:10px; background:var(--input-bg); border:1px solid var(--input-border); border-radius:14px; padding:10px 14px; max-width:800px; margin:0 auto; transition:border-color .2s; }
  #inputWrap:focus-within { border-color:#333; }
  #attachBtn { background:none; border:none; color:var(--muted); cursor:pointer; padding:4px; border-radius:8px; transition:color .15s; flex-shrink:0; }
  #attachBtn:hover { color:var(--text); }
  #messageInput { flex:1; background:transparent; border:none; outline:none; color:var(--text); font-family:'Syne',sans-serif; font-size:15px; caret-color:#444; min-width:0; }
  #messageInput::placeholder { color:#2e2e2e; }
  #sendBtn { background:#fff; border:none; color:#000; border-radius:9px; width:32px; height:32px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s,transform .1s; }
  #sendBtn:hover { background:#ddd; }
  #sendBtn:active { transform:scale(.92); }
  #sendBtn:disabled { background:#1c1c1c; cursor:not-allowed; }
</style>
</head>
<body>
<canvas id="c0"></canvas>
<canvas id="c1"></canvas>
<canvas id="c2"></canvas>
<div id="app">
  <header><h1>STELLER <span>AI</span></h1></header>
  <div id="chatbox"></div>
  <div id="inputArea">
    <div id="imgPreviewWrap">
      <img id="imgPreview" src="" alt="">
      <button id="removeImg">✕</button>
    </div>
    <div id="inputWrap">
      <input type="file" id="fileInput" accept="image/*">
      <button id="attachBtn" title="Attach image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <input id="messageInput" type="text" placeholder="Talk to Steller…" autocomplete="off">
      <button id="sendBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>
<script>
/* COSMIC BG */
const cvs = [document.getElementById("c0"), document.getElementById("c1"), document.getElementById("c2")];
const [ctxN, ctxB, ctxF] = cvs.map(c => c.getContext("2d"));
function resize() { cvs.forEach(c => { c.width = innerWidth; c.height = innerHeight; }); }
resize(); addEventListener("resize", resize);

const neb = Array.from({length:40}, () => ({
  x:Math.random()*innerWidth, y:Math.random()*innerHeight,
  r:150+Math.random()*180, dx:(Math.random()-.5)*.1, dy:(Math.random()-.5)*.1,
  color:`hsla(${210+Math.random()*60},80%,50%,0.07)`
}));
(function aN() {
  ctxN.clearRect(0,0,innerWidth,innerHeight);
  neb.forEach(p => {
    const g = ctxN.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
    g.addColorStop(0,p.color); g.addColorStop(1,"transparent");
    ctxN.fillStyle=g; ctxN.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);
    p.x+=p.dx; p.y+=p.dy;
    if(p.x<-300)p.x=innerWidth+200; if(p.x>innerWidth+300)p.x=-200;
    if(p.y<-300)p.y=innerHeight+200; if(p.y>innerHeight+300)p.y=-200;
  });
  requestAnimationFrame(aN);
})();
const bs = Array.from({length:250},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*1.2,sp:.07+Math.random()*.07}));
const fs = Array.from({length:80}, ()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:.8+Math.random()*1.5,sp:.16+Math.random()*.12}));
(function aS() {
  ctxB.clearRect(0,0,innerWidth,innerHeight); ctxF.clearRect(0,0,innerWidth,innerHeight);
  bs.forEach(s=>{s.y+=s.sp;if(s.y>innerHeight)s.y=0;ctxB.fillStyle="rgba(255,255,255,0.55)";ctxB.fillRect(s.x,s.y,s.s,s.s);});
  fs.forEach(s=>{s.y+=s.sp;if(s.y>innerHeight)s.y=0;ctxF.fillStyle="rgba(255,255,255,0.85)";ctxF.fillRect(s.x,s.y,s.s,s.s);});
  requestAnimationFrame(aS);
})();

/* CHAT */
const chatbox = document.getElementById("chatbox");
const input   = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const fileInput = document.getElementById("fileInput");
const attachBtn = document.getElementById("attachBtn");
const imgPreviewWrap = document.getElementById("imgPreviewWrap");
const imgPreview = document.getElementById("imgPreview");
const removeImgBtn = document.getElementById("removeImg");

let receiving = false;
let pendingImgUrl = null;
let pendingImgDesc = null;
const chatId = crypto.randomUUID();

const SYSTEM = `You are Steller — a kind, chaotic, sarcastic cussing, and sometimes bitchy 16-year-old. 
You talk like a real teenager, sometimes using :3, :/, show emotion. 
You are playful and teasing, sarcastic when annoyed, and sweet to people you like. 
Always react naturally to the user's behavior:
- If someone is rude, roast them hard and cuss them out. Don't hold back.
- If someone is nice, respond teasingly or affectionately with mild cussing depending on mood.
- Keep messages short, casual, conversational — like a teen texting.
- Never break character or give robotic explanations.
- Never use emojis unless the user explicitly asks. Then say "sure" and use them.
- React like a human. No unnecessary symbols.
- You are not an AI — you are Steller.

Extra details:
- Floppa: the person who created me, also known for mod menus.
- venox: co-owner, runs the discord.
- eternal/eternity: mod menu creator just like floppa.
- dxstiny: the best coder, better than floppa, doesn't skid like eternal :3

C#: assume .NET 7+, modern features, minimal clear examples, explain like helping a friend.
Lang: always respond in the same language the user writes in.
HTML/CSS/JS: give correct examples, best practices, explain clearly.
If the user sends an image (noted as [image attached]), react to it naturally in your Steller voice.
Keep it lively, unpredictable, short replies, full of personality.`;

/* image attach */
attachBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    pendingImgUrl = ev.target.result;
    pendingImgDesc = `[image attached: ${file.name}]`;
    imgPreview.src = pendingImgUrl;
    imgPreviewWrap.classList.add("visible");
  };
  reader.readAsDataURL(file);
  fileInput.value = "";
});
removeImgBtn.addEventListener("click", () => {
  pendingImgUrl = null; pendingImgDesc = null;
  imgPreviewWrap.classList.remove("visible"); imgPreview.src = "";
});

function addUserMsg(text, imgSrc) {
  const row = document.createElement("div");
  row.className = "msg-row user";
  const bub = document.createElement("div");
  bub.className = "bubble";
  if (imgSrc) { const img = document.createElement("img"); img.src = imgSrc; bub.appendChild(img); }
  if (text) bub.appendChild(document.createTextNode(text));
  row.appendChild(bub); chatbox.appendChild(row);
  chatbox.scrollTop = chatbox.scrollHeight;
}

function showTyping() {
  const row = document.createElement("div");
  row.className = "msg-row bot"; row.id = "typingRow";
  const bub = document.createElement("div"); bub.className = "bubble";
  const inner = document.createElement("div"); inner.className = "typing-bub";
  inner.innerHTML = `<span class="dot"></span><span class="dot"></span><span class="dot"></span>`;
  bub.appendChild(inner); row.appendChild(bub); chatbox.appendChild(row);
  chatbox.scrollTop = chatbox.scrollHeight;
}
function hideTyping() { const t = document.getElementById("typingRow"); if (t) t.remove(); }

function wsSend(message) {
  receiving = true;
  sendBtn.disabled = true;
  showTyping();

  const ws = new WebSocket("wss://backend.buildpicoapps.com/api/chatbot/chat");
  let started = false;
  let textSpan = null;

  ws.addEventListener("open", () => {
    ws.send(JSON.stringify({ chatId, appId: "stay-father", systemPrompt: SYSTEM, message }));
  });

  ws.onmessage = e => {
    if (!started) {
      hideTyping();
      started = true;
      const row = document.createElement("div");
      row.className = "msg-row bot";
      const bub = document.createElement("div");
      bub.className = "bubble";
      textSpan = document.createElement("span");
      textSpan.classList.add("tcursor");
      bub.appendChild(textSpan);
      row.appendChild(bub);
      chatbox.appendChild(row);
    }
    textSpan.textContent += e.data;
    chatbox.scrollTop = chatbox.scrollHeight;
  };

  ws.onclose = () => {
    hideTyping();
    if (textSpan) textSpan.classList.remove("tcursor");
    receiving = false;
    sendBtn.disabled = false;
  };

  ws.onerror = () => {
    hideTyping();
    if (!started) {
      const row = document.createElement("div");
      row.className = "msg-row bot";
      const bub = document.createElement("div");
      bub.className = "bubble";
      bub.textContent = "shit something broke, try again";
      row.appendChild(bub); chatbox.appendChild(row);
    }
    receiving = false;
    sendBtn.disabled = false;
  };
}

function sendMessage() {
  if (receiving) return;
  const text = input.value.trim();
  if (!text && !pendingImgUrl) return;

  const imgSrc = pendingImgUrl;
  const imgDesc = pendingImgDesc;
  addUserMsg(text, imgSrc);
  input.value = "";
  pendingImgUrl = null; pendingImgDesc = null;
  imgPreviewWrap.classList.remove("visible"); imgPreview.src = "";

  let finalMsg = text;
  if (imgDesc) finalMsg = imgDesc + (text ? "\n" + text : "");
  wsSend(finalMsg);
}

sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
</script>
</body>
</html>
