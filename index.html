<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stellerio — Game Hub</title><meta name="description" content="A clean animated gaming hub for Stellerio projects."><script src="https://cdn.tailwindcss.com"></script><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');:root{--bg:#06070b;--panel:rgba(14,16,24,.74);--line:rgba(255,255,255,.09)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:#f7f7fb;font-family:'DM Sans',sans-serif;overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}.display{font-family:'Space Grotesk',sans-serif}.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.gradient{background:linear-gradient(100deg,#fff,#a99dff,#53dcff,#ff83cb,#fff);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:grad 6s linear infinite}.gridbg{background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:60px 60px;mask-image:linear-gradient(#000,transparent 90%)}.cursor{position:fixed;width:260px;height:260px;border-radius:50%;pointer-events:none;z-index:3;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(139,124,255,.12),transparent 68%)}.card{transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .4s}.card:hover{transform:translateY(-7px) rotateX(2deg);border-color:rgba(150,130,255,.4);box-shadow:0 28px 70px #0008}@keyframes grad{to{background-position:220%}}@keyframes pulse{50%{opacity:.4;transform:scale(1.4)}}.pulse{animation:pulse 1.8s infinite}.reduced *{animation:none!important;transition:none!important;scroll-behavior:auto!important}@media(max-width:800px){.cursor{display:none}}</style></head><body><div id="three" class="fixed inset-0 z-0"></div><div class="gridbg fixed inset-0 z-0 pointer-events-none"></div><div id="cursor" class="cursor"></div><div id="root" class="relative z-10"></div><script>
const{useEffect,useMemo,useState}=React;const Icon=({type})=>{const p={className:'w-5 h-5',viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round'};const d={home:<><path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 21v-7h6v7"/></>,game:<><rect x="3" y="6" width="18" height="13" rx="4"/><path d="M7 12h4M9 10v4M15.5 11.5h.01M18 14h.01"/></>,gear:<><circle cx="12" cy="12" r="3"/><path d="M19 15l1 1-2 2-1-1a7 7 0 0 1-3 1v2h-4v-2a7 7 0 0 1-3-1l-1 1-2-2 1-1a7 7 0 0 1-1-3H2V8h2a7 7 0 0 1 1-3L4 4l2-2 1 1a7 7 0 0 1 3-1V0h4v2a7 7 0 0 1 3 1l1-1 2 2-1 1a7 7 0 0 1 1 3h2v4h-2a7 7 0 0 1-1 3Z"/></>};return <svg {...p}>{d[type]}</svg>};
function Background(){useEffect(()=>{const host=document.getElementById('three'),s=new THREE.Scene(),c=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);c.position.z=5;const r=new THREE.WebGLRenderer({alpha:true,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);host.appendChild(r.domElement);const g=new THREE.BufferGeometry(),a=[];for(let i=0;i<480;i++)a.push((Math.random()-.5)*14,(Math.random()-.5)*9,(Math.random()-.5)*7);g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));s.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x9a8cff,size:.018,transparent:true,opacity:.55})));const orb=new THREE.Mesh(new THREE.IcosahedronGeometry(1.5,2),new THREE.MeshBasicMaterial({color:0x8b7cff,wireframe:true,transparent:true,opacity:.12}));s.add(orb);let x=0,y=0;const move=e=>{x=(e.clientX/innerWidth-.5)*.35;y=(e.clientY/innerHeight-.5)*.2};addEventListener('pointermove',move);const tick=()=>{orb.rotation.x+=.001;orb.rotation.y+=.0015;orb.position.x+=(x-orb.position.x)*.02;orb.position.y+=(-y-orb.position.y)*.02;r.render(s,c);requestAnimationFrame(tick)};tick();const rs=()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};addEventListener('resize',rs);return()=>{removeEventListener('pointermove',move);removeEventListener('resize',rs);r.dispose();host.innerHTML=''}},[]);return null}
function Settings({open,close,reduced,setReduced}){if(!open)return null;return <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-md grid place-items-center p-5" onClick={e=>e.target===e.currentTarget&&close()}><div className="glass rounded-3xl p-6 w-full max-w-md shadow-2xl"><div className="flex justify-between"><div><div className="text-[9px] uppercase tracking-[.2em] text-violet-300">Settings</div><h2 className="display text-2xl font-bold">Stellerio</h2></div><button onClick={close} className="w-9 h-9 rounded-xl bg-white/5 text-zinc-400">×</button></div><div className="mt-7 pt-5 border-t border-white/10 flex items-center justify-between"><span className="text-sm text-zinc-300">Reduced motion</span><button onClick={()=>setReduced(!reduced)} className={'w-11 h-6 rounded-full p-1 '+(reduced?'bg-violet-500':'bg-zinc-700')}><i className={'block w-4 h-4 rounded-full bg-white transition '+(reduced?'translate-x-5':'')}/></button></div><p className="text-[10px] text-zinc-600 mt-4">Turns off decorative motion while keeping the site functional.</p></div></div>}
function GameCard({g}){return <article className="card glass rounded-3xl p-6 min-h-[220px] relative overflow-hidden"><div className="flex justify-between"><div className="w-11 h-11 rounded-2xl bg-white/5 border border-white/10 grid place-items-center text-violet-300"><Icon type="game"/></div><span className="text-[8px] text-zinc-500 border border-white/10 rounded-full px-2 py-1 h-fit">{(g.tags||['GAME'])[0]}</span></div><h2 className="display text-xl font-bold mt-5">{g.name}</h2><p className="text-[10px] text-zinc-500 leading-6 mt-1">{g.description}</p><div className="flex justify-between items-end mt-5 gap-3"><div className="flex gap-1 flex-wrap">{(g.tags||[]).slice(0,3).map(t=><span key={t} className="text-[7px] px-2 py-1 rounded-md bg-white/5 text-zinc-500">{t}</span>)}</div>{g.github?<a href={g.github} target="_blank" rel="noopener noreferrer" className="shrink-0 px-3 py-2 rounded-xl bg-white text-black text-[9px] font-bold hover:-translate-y-1 transition">Open GitHub ↗</a>:<span className="shrink-0 px-3 py-2 rounded-xl bg-white/5 text-zinc-600 text-[9px]">Link not set</span>}</div></article>}
function App(){const[page,setPage]=useState('home'),[games,setGames]=useState([]),[query,setQuery]=useState(''),[settings,setSettings]=useState(false),[reduced,setReduced]=useState(false),[loaded,setLoaded]=useState(false);useEffect(()=>{fetch('./data/games.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('games.json unavailable');return r.json()}).then(d=>setGames(d.games||[])).catch(e=>console.error(e)).finally(()=>setLoaded(true))},[]);useEffect(()=>{document.body.classList.toggle('reduced',reduced)},[reduced]);useEffect(()=>{if(reduced)return;gsap.registerPlugin(ScrollTrigger);gsap.from('.heroItem',{opacity:0,y:25,duration:.8,stagger:.08,ease:'power3.out'});gsap.utils.toArray('.reveal').forEach(el=>gsap.fromTo(el,{opacity:0,y:24},{opacity:1,y:0,duration:.7,scrollTrigger:{trigger:el,start:'top 88%'}}))},[page,loaded]);const filtered=useMemo(()=>games.filter(g=>(g.name+' '+g.description+' '+(g.tags||[]).join(' ')).toLowerCase().includes(query.toLowerCase())),[games,query]);const nav=p=>{setPage(p);window.scrollTo({top:0,behavior:reduced?'auto':'smooth'})};return <><Background/><div className="relative min-h-screen flex"><aside className="hidden md:flex fixed left-4 top-4 bottom-4 w-56 z-30 glass rounded-3xl p-3 flex-col"><button onClick={()=>nav('home')} className="flex items-center gap-3 p-3 mb-6 text-left"><span className="w-10 h-10 rounded-2xl bg-gradient-to-br from-violet-400 to-cyan-300 text-black font-bold grid place-items-center">S</span><span><b className="display block">Stellerio</b><small className="text-[9px] text-zinc-500">GAME HUB</small></span></button><div className="space-y-1"><button onClick={()=>nav('home')} className={'w-full flex gap-3 items-center p-3 rounded-2xl text-sm '+(page==='home'?'bg-white/10':'text-zinc-500 hover:bg-white/5 hover:text-white')}><Icon type="home"/>Home</button><button onClick={()=>nav('games')} className={'w-full flex gap-3 items-center p-3 rounded-2xl text-sm '+(page==='games'?'bg-white/10':'text-zinc-500 hover:bg-white/5 hover:text-white')}><Icon type="game"/>Games</button></div><button onClick={()=>setSettings(true)} className="mt-auto w-full flex gap-3 items-center p-3 rounded-2xl text-sm text-zinc-500 hover:bg-white/5 hover:text-white"><Icon type="gear"/>Settings</button></aside><main className="md:ml-64 w-full"><header className="sticky top-3 z-20 px-4"><div className="glass max-w-6xl mx-auto rounded-2xl h-14 px-4 flex items-center gap-3"><button onClick={()=>nav('home')} className="display font-bold">STELLERIO<span className="text-violet-400">.</span></button><div className="hidden sm:flex ml-auto gap-1"><button onClick={()=>nav('home')} className="px-3 py-2 text-xs text-zinc-500 hover:text-white rounded-xl hover:bg-white/5">Home</button><button onClick={()=>nav('games')} className="px-3 py-2 text-xs text-zinc-500 hover:text-white rounded-xl hover:bg-white/5">Games</button><button onClick={()=>setSettings(true)} className="px-3 py-2 text-xs text-zinc-500 hover:text-white rounded-xl hover:bg-white/5">Settings</button></div><div className="ml-2 hidden sm:flex items-center gap-2 pl-3 border-l border-white/10 text-[10px] text-zinc-600"><i className="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse"/>Online</div></div></header>{page==='home'?<section className="max-w-6xl mx-auto px-5"><div className="min-h-[690px] flex items-center"><div className="max-w-4xl"><div className="heroItem inline-flex items-center gap-2 px-3 py-2 rounded-full border border-white/10 bg-white/5 text-[9px] uppercase tracking-[.18em] text-zinc-400"><i className="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse"/>Game hub / online</div><h1 className="heroItem display font-bold text-[clamp(64px,10vw,132px)] leading-[.86] tracking-[-.09em] mt-7">PLAY<br/><span className="gradient">SOMETHING NEW.</span></h1><p className="heroItem text-sm text-zinc-500 max-w-xl leading-7 mt-7">A focused home for games and projects. Smooth navigation, subtle effects and a library that stays easy to manage.</p><div className="heroItem flex gap-2 mt-7"><button onClick={()=>nav('games')} className="px-5 py-3 rounded-xl bg-white text-black text-[11px] font-bold hover:-translate-y-1 transition">Browse games →</button><button onClick={()=>document.getElementById('system').scrollIntoView({behavior:reduced?'auto':'smooth'})} className="px-5 py-3 rounded-xl bg-white/5 border border-white/10 text-[11px] font-bold hover:-translate-y-1 transition">How it works</button></div><div className="heroItem flex gap-9 mt-12"><div><b className="display text-2xl">{games.length}</b><small className="block text-[9px] text-zinc-600">projects loaded</small></div><div><b className="display text-2xl">∞</b><small className="block text-[9px] text-zinc-600">room to grow</small></div><div><b className="display text-2xl">01</b><small className="block text-[9px] text-zinc-600">game library</small></div></div></div></div><div id="system" className="reveal py-24"><div className="text-[9px] tracking-[.2em] text-violet-300 uppercase">01 / System</div><h2 className="display text-5xl font-bold tracking-tight mt-2">Clean by design.</h2><div className="grid md:grid-cols-2 gap-3 mt-8"><div className="glass rounded-3xl p-7"><Icon type="game"/><h3 className="display text-xl font-bold mt-5">Data-driven games</h3><p className="text-xs text-zinc-500 leading-6 mt-2">Games are loaded directly from <code className="text-zinc-300">data/games.json</code>. Add a name, description, tags and optional GitHub link.</p></div><div className="glass rounded-3xl p-7"><span className="text-violet-300 text-2xl">✦</span><h3 className="display text-xl font-bold mt-5">Motion with purpose</h3><p className="text-xs text-zinc-500 leading-6 mt-2">Three.js provides the ambient depth and GSAP handles entrance motion. Nothing is added just to fill space.</p></div></div></div></section>:<section className="max-w-6xl mx-auto px-5 py-20"><div className="reveal flex justify-between items-end gap-5 mb-8"><div><div className="text-[9px] tracking-[.2em] text-violet-300 uppercase">02 / Library</div><h1 className="display text-6xl font-bold tracking-[-.06em] mt-2">Games.</h1></div><p className="text-[10px] text-zinc-600">{loaded?filtered.length:0} results</p></div><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search games..." className="w-full md:max-w-md mb-6 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-xs outline-none focus:border-violet-400/50"/><div className="grid md:grid-cols-2 gap-3">{filtered.length?filtered.map((g,i)=><GameCard key={g.id||i} g={g}/>):<div className="glass rounded-3xl p-16 text-center md:col-span-2 text-zinc-600 text-sm">{loaded?'No games match your search.':'Loading games...'}</div>}</div></section>}<footer className="max-w-6xl mx-auto px-5 py-16 border-t border-white/5 text-[9px] text-zinc-700 flex justify-between"><span>STELLERIO · GAME HUB</span><span>GitHub Pages</span></footer></main><Settings open={settings} close={()=>setSettings(false)} reduced={reduced} setReduced={setReduced}/></div></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);const c=document.getElementById('cursor');addEventListener('pointermove',e=>{c.style.left=e.clientX+'px';c.style.top=e.clientY+'px'});document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();document.querySelector('input')?.focus()}if(e.key==='Escape')document.querySelector('.fixed.inset-0.z-50')?.click()});</script></body></html>
