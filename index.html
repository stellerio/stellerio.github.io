<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>STELLAR 123912839812u</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
body{position:relative}
.space{position:fixed;inset:0;overflow:hidden;background:#000}
.stars,.stars:before,.stars:after{content:"";position:absolute;inset:-35%;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.4px);background-size:97px 97px;opacity:.58;animation:travel 46s linear infinite}
.stars:before{background-size:157px 157px;opacity:.35;animation-duration:72s;animation-direction:reverse}
.stars:after{background-size:53px 53px;opacity:.2;animation-duration:29s}
.vignette{position:absolute;inset:0;background:radial-gradient(circle at center,transparent 35%,#000 100%);pointer-events:none}
.ui{position:relative;z-index:5;width:100%;height:100%}
.menu{position:fixed;z-index:20;top:20px;left:20px;width:46px;height:46px;border:1px solid #ffffff1c;border-radius:14px;background:#050505cc;backdrop-filter:blur(18px);display:grid;place-items:center;cursor:pointer;color:#fff;transition:.25s;box-shadow:0 12px 45px #000}
.menu:hover{background:#111;transform:scale(1.05)}
.menu svg{width:20px;height:20px}
.sidebar{position:fixed;z-index:19;top:12px;left:12px;bottom:12px;width:275px;padding:82px 14px 14px;border:1px solid #ffffff16;border-radius:24px;background:#050505e8;backdrop-filter:blur(28px);box-shadow:20px 0 80px #000;transform:translateX(-110%);transition:transform .45s cubic-bezier(.22,.8,.22,1)}
.sidebar.open{transform:translateX(0)}
.close{position:absolute;top:20px;right:16px;width:36px;height:36px;border:1px solid #ffffff12;border-radius:11px;background:#fff00000;color:#fff;display:grid;place-items:center;cursor:pointer}
.brand{position:absolute;left:20px;top:24px;font-size:14px;font-weight:900;letter-spacing:.28em}
.games{display:grid;gap:7px;overflow:auto;height:100%;padding-right:2px}
.games::-webkit-scrollbar{width:3px}.games::-webkit-scrollbar-thumb{background:#ffffff20;border-radius:10px}
.game{width:100%;height:50px;border:1px solid transparent;border-radius:13px;background:#ffffff03;color:#8f8f8f;display:flex;align-items:center;gap:13px;padding:0 13px;cursor:pointer;transition:.22s;text-align:left}
.game:hover,.game.active{background:#fff0;border-color:#ffffff16;color:#fff;transform:translateX(3px)}
.game svg{width:19px;height:19px;flex:none;stroke:currentColor}
.game span{font-size:13px;font-weight:650;letter-spacing:.02em}
.viewport{position:absolute;inset:0;padding:20px;display:flex;align-items:center;justify-content:center}
.frame{width:min(1500px,92vw);height:min(860px,88vh);border:1px solid #ffffff12;border-radius:24px;overflow:hidden;background:#000;box-shadow:0 30px 100px #000}
.frame iframe{width:100%;height:100%;border:0;display:block;background:#000}
.home{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.home h1{margin:0;font-size:clamp(70px,13vw,190px);font-weight:950;letter-spacing:-.075em;color:#fff;animation:soft 5s ease-in-out infinite}
.hidden{display:none}
@keyframes travel{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,180px,0)}}
@keyframes soft{50%{opacity:.78;transform:scale(1.015)}}
@media(max-width:650px){.sidebar{width:calc(100% - 24px)}.viewport{padding:10px}.frame{width:100%;height:100%;border-radius:18px}}
</style>
</head>
<body>
<div class="space"><div class="stars"></div><div class="vignette"></div></div>
<div class="ui">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>
<aside class="sidebar" id="sidebar">
<div class="brand">STELLAR</div>
<button class="close" id="close" aria-label="Close">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
<nav class="games" id="games">
<button class="game active" data-src="about:blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 12h8M12 8v8"/></svg><span>Game 1</span></button>
<button class="game" data-src="about:blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M8 12h8M12 8v8"/></svg><span>Game 2</span></button>
<button class="game" data-src="about:blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14v10H5z"/><path d="M8 10h3M9.5 8.5v3M15 10h.01M17 12h.01"/></svg><span>Game 3</span></button>
<button class="game" data-src="about:blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.7 5.5L21 9.4l-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.4l6.3-.9L12 3z"/></svg><span>Game 4</span></button>
<button class="game" data-src="about:blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 5h12v14H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span>Game 5</span></button>
<button class="game" data-src="about:blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16M4 16h16M8 4v16M16 4v16"/></svg><span>Game 6</span></button>
<button class="game" data-src="about:blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>Game 7</span></button>
<button class="game" data-src="about:blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18l6-7 4 4 3-4 3 7H4z"/><circle cx="9" cy="7" r="2"/></svg><span>Game 8</span></button>
</nav>
</aside>
<main class="viewport">
<div class="home" id="home"><h1>STELLAR</h1></div>
<div class="frame hidden" id="frame"><iframe id="gameFrame" allowfullscreen></iframe></div>
</main>
</div>
<script>
const sidebar=document.getElementById("sidebar"),menu=document.getElementById("menu"),close=document.getElementById("close"),home=document.getElementById("home"),frame=document.getElementById("frame"),gameFrame=document.getElementById("gameFrame");
menu.onclick=()=>sidebar.classList.add("open");
close.onclick=()=>sidebar.classList.remove("open");
document.querySelectorAll(".game").forEach(button=>{
button.onclick=()=>{
document.querySelectorAll(".game").forEach(x=>x.classList.remove("active"));
button.classList.add("active");
gameFrame.src=button.dataset.src;
home.classList.add("hidden");
frame.classList.remove("hidden");
sidebar.classList.remove("open");
};
});
</script>
</body>
</html>
