<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STELLAR 8282</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}
.space{position:fixed;inset:0;overflow:hidden;background:#000}.stars{position:absolute;inset:-15%;overflow:hidden}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 5px #fff;opacity:.2;animation:drift var(--duration) linear infinite;animation-delay:var(--delay)}.star.small{width:1px;height:1px;box-shadow:none}.star.bright{width:3px;height:3px;box-shadow:0 0 9px 1px #fff}.vignette{position:absolute;inset:0;background:radial-gradient(circle at center,transparent 25%,#000 100%);pointer-events:none}
.ui{position:relative;z-index:5;width:100%;height:100%}.menu{position:fixed;z-index:20;top:20px;left:20px;width:46px;height:46px;border:1px solid #ffffff1c;border-radius:14px;background:#050505cc;backdrop-filter:blur(18px);display:grid;place-items:center;cursor:pointer;color:#fff;transition:.25s;box-shadow:0 12px 45px #000}.menu:hover{background:#111;transform:scale(1.05)}.menu svg{width:20px;height:20px}
.sidebar{position:fixed;z-index:19;top:12px;left:12px;bottom:12px;width:275px;padding:76px 14px 14px;border:1px solid #ffffff16;border-radius:24px;background:#050505e8;backdrop-filter:blur(28px);box-shadow:20px 0 80px #000;transform:translateX(-110%);transition:transform .45s cubic-bezier(.22,.8,.22,1)}.sidebar.open{transform:translateX(0)}.close{position:absolute;top:20px;right:16px;width:36px;height:36px;border:1px solid #ffffff12;border-radius:11px;background:#fff0;color:#fff;display:grid;place-items:center;cursor:pointer}.brand{position:absolute;left:20px;top:24px;font-size:14px;font-weight:900;letter-spacing:.28em}
.search{position:absolute;left:14px;right:14px;top:58px;height:44px;border:1px solid #ffffff12;border-radius:12px;background:#ffffff06;color:#fff;outline:none;padding:0 13px 0 39px}.search:focus{border-color:#ffffff2c;background:#ffffff09}.search::placeholder{color:#696969}.searchWrap{position:relative}.searchIcon{position:absolute;z-index:2;left:27px;top:72px;width:17px;height:17px;color:#777;pointer-events:none}
.games{display:grid;gap:7px;overflow:auto;height:100%;padding-top:52px;padding-right:2px}.games::-webkit-scrollbar{width:3px}.games::-webkit-scrollbar-thumb{background:#ffffff20;border-radius:10px}.game{width:100%;height:50px;border:1px solid transparent;border-radius:13px;background:#ffffff03;color:#8f8f8f;display:flex;align-items:center;gap:13px;padding:0 13px;cursor:pointer;transition:.22s;text-align:left}.game:hover,.game.active{background:#fff0;border-color:#ffffff16;color:#fff;transform:translateX(3px)}.game svg{width:19px;height:19px;flex:none;stroke:currentColor}.game span{font-size:13px;font-weight:650;letter-spacing:.02em}
.viewport{position:absolute;inset:0;padding:20px;display:flex;align-items:center;justify-content:center}.frame{position:relative;width:min(1500px,92vw);height:min(860px,88vh);border:1px solid #ffffff12;border-radius:24px;overflow:hidden;background:#000;box-shadow:0 30px 100px #000;transition:all .3s ease}.frame iframe{width:100%;height:100%;border:0;display:block;background:#000}.frame.minimized{width:min(520px,70vw);height:min(360px,55vh)}.frame.fullscreen{position:fixed;z-index:50;inset:0;width:100vw;height:100vh;border:0;border-radius:0}.controls{position:absolute;z-index:4;top:12px;right:12px;display:flex;gap:7px;opacity:0;transform:translateY(-5px);transition:.2s}.frame:hover .controls{opacity:1;transform:translateY(0)}.control{width:38px;height:38px;border:1px solid #ffffff18;border-radius:11px;background:#050505d9;color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(12px)}.control:hover{background:#181818}.control svg{width:18px;height:18px}.home{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.home h1{margin:0;font-size:clamp(70px,13vw,190px);font-weight:950;letter-spacing:-.075em;color:#fff;animation:soft 5s ease-in-out infinite}.hidden{display:none}
@keyframes drift{0%{transform:translate3d(0,18vh,0) scale(.8);opacity:0}8%{opacity:var(--opacity)}50%{opacity:var(--opacity)}100%{transform:translate3d(var(--x),-125vh,0) scale(1.2);opacity:0}}@keyframes soft{50%{opacity:.78;transform:scale(1.015)}}@media(max-width:650px){.sidebar{width:calc(100% - 24px)}.viewport{padding:10px}.frame{width:100%;height:100%;border-radius:18px}.frame.minimized{width:88vw;height:48vh}}
</style></head>
<body><div class="space"><div class="stars" id="stars"></div><div class="vignette"></div></div><div class="ui">
<button class="menu" id="menu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<aside class="sidebar" id="sidebar"><div class="brand">STELLAR</div><button class="close" id="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div class="searchWrap"><svg class="searchIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="search" id="search" type="search" placeholder="Search games..." autocomplete="off"></div>
<nav class="games" id="games">
<button class="game active" data-src="about:blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 12h8M12 8v8"/></svg><span>Game 1</span></button>
<button class="game" data-src="about:blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M8 12h8M12 8v8"/></svg><span>Game 2</span></button>
<button class="game" data-src="about:blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14v10H5z"/><path d="M8 10h3M9.5 8.5v3M15 10h.01M17 12h.01"/></svg><span>Game 3</span></button>
<button class="game" data-src="about:blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.7 5.5L21 9.4l-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.4l6.3-.9L12 3z"/></svg><span>Game 4</span></button>
<button class="game" data-src="about:blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 5h12v14H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span>Game 5</span></button>
<button class="game" data-src="about:blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16M4 16h16M8 4v16M16 4v16"/></svg><span>Game 6</span></button>
<button class="game" data-src="about:blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>Game 7</span></button>
<button class="game" data-src="about:blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18l6-7 4 4 3-4 3 7H4z"/><circle cx="9" cy="7" r="2"/></svg><span>Game 8</span></button>
</nav></aside>
<main class="viewport"><div class="home" id="home"><h1>STELLAR 11111</h1></div>
<div class="frame hidden" id="frame"><div class="controls">
<button class="control" id="minimize" aria-label="Minimize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
<button class="control" id="fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/></svg></button>
</div><iframe id="gameFrame" allowfullscreen></iframe></div></main></div>
<script>
const stars=document.getElementById("stars");for(let i=0;i<260;i++){const star=document.createElement("i"),size=Math.random();star.className="star"+(size<.55?" small":"")+(size>.94?" bright":"");star.style.left=Math.random()*100+"%";star.style.top=Math.random()*125+"%";star.style.setProperty("--x",(Math.random()-.5)*35+"vw");star.style.setProperty("--duration",18+Math.random()*55+"s");star.style.setProperty("--delay",-Math.random()*70+"s");star.style.setProperty("--opacity",(0.25+Math.random()*.7).toFixed(2));stars.appendChild(star)}
const sidebar=document.getElementById("sidebar"),menu=document.getElementById("menu"),close=document.getElementById("close"),home=document.getElementById("home"),frame=document.getElementById("frame"),gameFrame=document.getElementById("gameFrame"),search=document.getElementById("search");
menu.onclick=()=>sidebar.classList.add("open");close.onclick=()=>sidebar.classList.remove("open");
function openGame(button){document.querySelectorAll(".game").forEach(x=>x.classList.remove("active"));button.classList.add("active");gameFrame.src=button.dataset.src;home.classList.add("hidden");frame.classList.remove("hidden");frame.classList.remove("minimized");sidebar.classList.remove("open")}
document.querySelectorAll(".game").forEach(button=>button.onclick=()=>openGame(button));
search.oninput=()=>{const q=search.value.trim().toLowerCase();document.querySelectorAll(".game").forEach(g=>{g.style.display=g.querySelector("span").textContent.toLowerCase().includes(q)?"flex":"none"})};
document.getElementById("minimize").onclick=()=>frame.classList.toggle("minimized");
document.getElementById("fullscreen").onclick=async()=>{if(!document.fullscreenElement){await frame.requestFullscreen().catch(()=>{});frame.classList.add("fullscreen")}else{await document.exitFullscreen().catch(()=>{});frame.classList.remove("fullscreen")}};
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement)frame.classList.remove("fullscreen")});
</script></body></html>
