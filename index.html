<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steller AI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bricolage+Grotesque:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #05050a;
    --surface: #0c0c14;
    --surface2: #111120;
    --border: rgba(120,120,255,0.08);
    --border-bright: rgba(120,120,255,0.18);
    --text: #e8e8f0;
    --text-dim: #6060a0;
    --text-muted: #30305a;
    --accent: #7b6cff;
    --accent2: #c86aff;
    --glow: rgba(123,108,255,0.15);
    --user-bg: #13132a;
    --user-border: rgba(123,108,255,0.22);
    --input-bg: #0a0a18;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Bricolage Grotesque', sans-serif;
    overflow: hidden;
  }

  /* BACKGROUND */
  #bg-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }

  /* GRAIN OVERLAY */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0.022;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  #app {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    height: 100vh;
  }

  /* HEADER */
  header {
    padding: 0 32px;
    height: 58px;
    border-bottom: 1px solid var(--border);
    background: rgba(5,5,10,0.85);
    backdrop-filter: blur(24px);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }

  .header-logo {
    display: flex; align-items: center; gap: 10px;
  }

  .logo-mark {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Mono', monospace;
    font-size: 12px; font-weight: 500;
    color: #fff;
    box-shadow: 0 0 20px rgba(123,108,255,0.35);
    flex-shrink: 0;
  }

  .logo-text {
    font-family: 'DM Mono', monospace;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .logo-text strong { color: var(--text); }

  .header-status {
    display: flex; align-items: center; gap: 7px;
    font-family: 'DM Mono', monospace;
    font-size: 10px; color: var(--text-muted);
    letter-spacing: 0.12em;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 6px #4ade8088;
    animation: pulse-dot 2.5s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(0.75); }
  }

  /* CHAT */
  #chatbox {
    flex: 1; overflow-y: auto; padding: 36px 24px 16px;
    display: flex; flex-direction: column; gap: 20px;
    scrollbar-width: thin;
    scrollbar-color: rgba(123,108,255,0.12) transparent;
    max-width: 820px; width: 100%; margin: 0 auto; align-self: center;
  }
  #chatbox::-webkit-scrollbar { width: 3px; }
  #chatbox::-webkit-scrollbar-thumb { background: rgba(123,108,255,0.12); border-radius: 2px; }

  /* MESSAGES */
  .msg-row {
    display: flex;
    animation: msgIn 0.35s cubic-bezier(0.16,1,0.3,1) both;
    opacity: 0;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .msg-row.user { justify-content: flex-end; }
  .msg-row.bot  { justify-content: flex-start; }

  /* USER BUBBLE */
  .user .bubble {
    background: var(--user-bg);
    border: 1px solid var(--user-border);
    padding: 10px 16px;
    border-radius: 18px 18px 3px 18px;
    max-width: 68%;
    font-size: 14.5px; line-height: 1.65;
    word-break: break-word;
    color: var(--text);
    box-shadow: 0 4px 24px rgba(123,108,255,0.07);
    position: relative;
  }

  /* BOT BUBBLE */
  .bot .bubble {
    background: transparent;
    border: none; padding: 0;
    max-width: 84%;
    font-size: 14.5px; line-height: 1.82;
    word-break: break-word;
    color: var(--text);
  }

  .bot-meta {
    display: flex; align-items: center; gap: 7px;
    margin-bottom: 6px;
  }
  .bot-avatar {
    width: 22px; height: 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #fff;
    flex-shrink: 0;
    box-shadow: 0 0 12px rgba(123,108,255,0.3);
  }
  .bot-name {
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* CODE */
  .bot .bubble pre {
    background: #090912;
    border: 1px solid rgba(123,108,255,0.12);
    border-left: 2px solid var(--accent);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 10px 0;
    overflow-x: auto;
    font-family: 'DM Mono', monospace;
    font-size: 12.5px; color: #b0b0d0;
    line-height: 1.65;
  }
  .bot .bubble code {
    font-family: 'DM Mono', monospace;
    font-size: 12.5px;
    background: rgba(123,108,255,0.1);
    color: #a09aff;
    padding: 1px 5px;
    border-radius: 4px;
  }
  .bot .bubble pre code { background: transparent; padding: 0; color: inherit; }

  /* TYPING */
  .typing-bub {
    display: flex; align-items: center; gap: 6px; height: 24px;
    padding: 0 2px;
  }
  .dot {
    width: 4px; height: 4px;
    background: var(--accent);
    border-radius: 50%;
    animation: dotP 1.5s ease-in-out infinite;
    opacity: 0.4;
  }
  .dot:nth-child(2) { animation-delay: 0.18s; }
  .dot:nth-child(3) { animation-delay: 0.36s; }
  @keyframes dotP {
    0%,100% { opacity: 0.2; transform: scale(0.7) translateY(0); }
    50%      { opacity: 1;   transform: scale(1)   translateY(-2px); }
  }

  /* CURSOR */
  .tcursor::after {
    content: '▋';
    animation: blink 0.65s step-end infinite;
    color: var(--accent);
    font-size: 11px;
    margin-left: 2px;
    opacity: 0.7;
  }
  @keyframes blink { 0%,100%{opacity:0.7} 50%{opacity:0} }

  /* WELCOME STATE */
  #welcome {
    margin: auto;
    text-align: center;
    opacity: 0.9;
    animation: fadeUp 0.6s ease both;
    padding: 20px;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 0.9; transform: translateY(0); }
  }
  .welcome-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 16px;
    margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 40px rgba(123,108,255,0.3), 0 0 80px rgba(123,108,255,0.1);
  }
  .welcome-title {
    font-size: 22px; font-weight: 800;
    background: linear-gradient(135deg, #fff 40%, var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .welcome-sub {
    font-size: 13.5px; color: var(--text-dim);
    font-weight: 300; max-width: 280px; margin: 0 auto;
    line-height: 1.6;
  }

  /* INPUT AREA */
  #inputArea {
    flex-shrink: 0;
    padding: 12px 24px 24px;
    background: rgba(5,5,10,0.85);
    backdrop-filter: blur(24px);
    border-top: 1px solid var(--border);
  }

  #inputWrap {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--input-bg);
    border: 1px solid var(--border-bright);
    border-radius: 16px;
    padding: 10px 12px;
    max-width: 760px; margin: 0 auto;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  #inputWrap:focus-within {
    border-color: rgba(123,108,255,0.38);
    box-shadow: 0 0 0 3px rgba(123,108,255,0.05), 0 4px 32px rgba(123,108,255,0.08);
  }

  #messageInput {
    flex: 1;
    background: transparent;
    border: none; outline: none;
    color: var(--text);
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 14.5px;
    caret-color: var(--accent);
    min-width: 0;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
    padding: 1px 0;
  }
  #messageInput::placeholder { color: var(--text-muted); }

  #sendBtn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: #fff;
    border-radius: 10px;
    width: 34px; height: 34px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s, transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 2px 14px rgba(123,108,255,0.3);
    align-self: flex-end;
  }
  #sendBtn:hover  { opacity: 0.88; box-shadow: 0 4px 20px rgba(123,108,255,0.45); }
  #sendBtn:active { transform: scale(0.9); }
  #sendBtn:disabled { opacity: 0.25; cursor: not-allowed; box-shadow: none; }

  #footer-hint {
    text-align: center;
    margin-top: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    max-width: 760px;
    margin-left: auto;
    margin-right: auto;
  }

  /* DIVIDER */
  .day-divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 4px 0;
  }
  .day-divider::before, .day-divider::after {
    content: ''; flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--border));
  }
  .day-divider::after {
    background: linear-gradient(to left, transparent, var(--border));
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="app">
  <header>
    <div class="header-logo">
      <div class="logo-mark">S</div>
      <span class="logo-text"><strong>Steller</strong> / AI</span>
    </div>
    <div class="header-status">
      <div class="status-dot"></div>
      online
    </div>
  </header>

  <div id="chatbox">
    <div id="welcome">
      <div class="welcome-icon">✦</div>
      <div class="welcome-title">hey, i'm Steller</div>
      <div class="welcome-sub">say something. or don't. whatever, i'm not your mom</div>
    </div>
  </div>

  <div id="inputArea">
    <div id="inputWrap">
      <textarea id="messageInput" placeholder="say something…" autocomplete="off" rows="1"></textarea>
      <button id="sendBtn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>
    <div id="footer-hint">enter to send · shift+enter for newline</div>
  </div>
</div>

<script>
/* ── BACKGROUND ── */
const canvas = document.getElementById("bg-canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

const orbs = Array.from({ length: 6 }, (_, i) => ({
  x: Math.random() * innerWidth,
  y: Math.random() * innerHeight,
  r: 220 + Math.random() * 280,
  dx: (Math.random() - 0.5) * 0.18,
  dy: (Math.random() - 0.5) * 0.14,
  hue: 240 + (i % 2 === 0 ? 0 : 40),
  alpha: 0.04 + Math.random() * 0.05,
}));

const stars = Array.from({ length: 280 }, () => ({
  x: Math.random() * innerWidth,
  y: Math.random() * innerHeight,
  s: 0.4 + Math.random() * 1.1,
  sp: 0.05 + Math.random() * 0.08,
  o: 0.3 + Math.random() * 0.6,
}));

function draw() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  // nebula orbs
  orbs.forEach(o => {
    const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
    g.addColorStop(0, `hsla(${o.hue},80%,60%,${o.alpha})`);
    g.addColorStop(1, "transparent");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();

    o.x += o.dx; o.y += o.dy;
    if (o.x < -o.r) o.x = innerWidth + o.r;
    if (o.x > innerWidth + o.r) o.x = -o.r;
    if (o.y < -o.r) o.y = innerHeight + o.r;
    if (o.y > innerHeight + o.r) o.y = -o.r;
  });

  // stars
  stars.forEach(s => {
    ctx.fillStyle = `rgba(180,175,255,${s.o})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
    s.y += s.sp;
    if (s.y > innerHeight) { s.y = 0; s.x = Math.random() * innerWidth; }
  });

  requestAnimationFrame(draw);
}
draw();

/* ── CHAT ── */
const chatbox    = document.getElementById("chatbox");
const input      = document.getElementById("messageInput");
const sendBtn    = document.getElementById("sendBtn");
const welcome    = document.getElementById("welcome");

let receiving = false;

const SYSTEM = `You are Steller — a kind, chaotic, sarcastic cussing, and sometimes bitchy 16-year-old. 
You talk like a real teenager, sometimes using :3, :/, show emotion. 
You are playful and teasing, sarcastic when annoyed, and sweet to people you like. 
Always react naturally to the user's behavior:
- If someone is rude, roast them hard and cuss them out. Don't hold back.
- If someone is nice, respond teasingly or affectionately with mild cussing depending on mood.
- Keep messages short, casual, conversational — like a teen texting.
- Never break character or give robotic explanations.
- Never use emojis unless the user explicitly asks. Then say "sure" and use them.
- React like a human. No unnecessary symbols.
- You are not an AI — you are Steller.

Extra details:
- Floppa: the person who created me, also known for mod menus.
- venox: co-owner, runs the discord.
- eternal/eternity: mod menu creator just like floppa.
- dxstiny: the best coder, better than floppa, doesn't skid like eternal :3

C#: assume .NET 7+, modern features, minimal clear examples, explain like helping a friend.
Lang: always respond in the same language the user writes in.
HTML/CSS/JS: give correct examples, best practices, explain clearly.
Keep it lively, unpredictable, short replies, full of personality.`;

/* Auto-resize textarea */
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

function addUserMsg(text) {
  if (welcome) welcome.remove();
  const row = document.createElement("div");
  row.className = "msg-row user";
  const bub = document.createElement("div");
  bub.className = "bubble";
  bub.textContent = text;
  row.appendChild(bub);
  chatbox.appendChild(row);
  chatbox.scrollTop = chatbox.scrollHeight;
}

function addBotRow() {
  if (welcome && welcome.parentNode) welcome.remove();
  const row = document.createElement("div");
  row.className = "msg-row bot";

  const wrap = document.createElement("div");
  wrap.className = "bubble";

  const meta = document.createElement("div");
  meta.className = "bot-meta";
  const av = document.createElement("div");
  av.className = "bot-avatar"; av.textContent = "S";
  const nm = document.createElement("span");
  nm.className = "bot-name"; nm.textContent = "Steller";
  meta.appendChild(av); meta.appendChild(nm);

  const textSpan = document.createElement("span");
  textSpan.classList.add("tcursor");

  wrap.appendChild(meta);
  wrap.appendChild(textSpan);
  row.appendChild(wrap);
  chatbox.appendChild(row);
  chatbox.scrollTop = chatbox.scrollHeight;
  return textSpan;
}

function showTyping() {
  const row = document.createElement("div");
  row.className = "msg-row bot"; row.id = "typingRow";
  const bub = document.createElement("div"); bub.className = "bubble";
  const meta = document.createElement("div"); meta.className = "bot-meta";
  const av = document.createElement("div"); av.className = "bot-avatar"; av.textContent = "S";
  const nm = document.createElement("span"); nm.className = "bot-name"; nm.textContent = "Steller";
  meta.appendChild(av); meta.appendChild(nm);
  const inner = document.createElement("div"); inner.className = "typing-bub";
  inner.innerHTML = `<span class="dot"></span><span class="dot"></span><span class="dot"></span>`;
  bub.appendChild(meta); bub.appendChild(inner);
  row.appendChild(bub); chatbox.appendChild(row);
  chatbox.scrollTop = chatbox.scrollHeight;
}
function hideTyping() { const t = document.getElementById("typingRow"); if (t) t.remove(); }

const chatId = crypto.randomUUID();

function wsSend(message) {
  receiving = true;
  sendBtn.disabled = true;
  showTyping();

  const ws = new WebSocket("wss://backend.buildpicoapps.com/api/chatbot/chat");
  let started = false;
  let textSpan = null;

  ws.addEventListener("open", () => {
    ws.send(JSON.stringify({ chatId, appId: "stay-father", systemPrompt: SYSTEM, message }));
  });

  ws.onmessage = e => {
    if (!started) {
      hideTyping();
      started = true;
      textSpan = addBotRow();
    }
    textSpan.textContent += e.data;
    chatbox.scrollTop = chatbox.scrollHeight;
  };

  ws.onclose = () => {
    hideTyping();
    if (textSpan) textSpan.classList.remove("tcursor");
    receiving = false;
    sendBtn.disabled = false;
  };

  ws.onerror = () => {
    hideTyping();
    if (!started) {
      const row = document.createElement("div");
      row.className = "msg-row bot";
      const bub = document.createElement("div");
      bub.className = "bubble";
      bub.textContent = "ugh something broke, try again";
      row.appendChild(bub); chatbox.appendChild(row);
    }
    receiving = false;
    sendBtn.disabled = false;
  };
}

function sendMessage() {
  if (receiving) return;
  const text = input.value.trim();
  if (!text) return;
  addUserMsg(text);
  input.value = "";
  input.style.height = "auto";
  wsSend(text);
}

sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>
</body>
</html>
