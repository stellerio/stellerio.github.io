<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STELLARIO — Game Hub</title><style>
:root{--bg:#05060a;--panel:#0d1019cc;--line:#ffffff14;--text:#f7f8ff;--muted:#8e95a8;--a:#7c5cff;--b:#29d8ff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);font-family:Inter,system-ui,Arial;background:radial-gradient(circle at 75% 0,#211650 0,transparent 34%),radial-gradient(circle at 15% 80%,#09213c 0,transparent 30%),#05060a;min-height:100vh;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#fff00008 1px,transparent 1px),linear-gradient(90deg,#fff00008 1px,transparent 1px);background-size:60px 60px;mask-image:linear-gradient(#000,transparent 80%);z-index:-1}
.sidebar{position:fixed;z-index:20;left:18px;top:18px;bottom:18px;width:235px;padding:20px 15px;border:1px solid var(--line);border-radius:26px;background:#080a10bf;backdrop-filter:blur(24px);box-shadow:0 25px 80px #0009}.brand{font-size:21px;font-weight:950;letter-spacing:.18em;padding:9px 12px 28px}.brand i{font-style:normal;color:var(--b)}.nav{display:grid;gap:8px}.nav button{border:1px solid transparent;background:transparent;color:#aeb5c7;text-align:left;padding:13px 14px;border-radius:14px;font:inherit;cursor:pointer;transition:.25s}.nav button:hover,.nav button.active{color:#fff;background:#7c5cff18;border-color:#7c5cff38;transform:translateX(3px)}.sidefoot{position:absolute;bottom:18px;left:18px;color:#687083;font-size:11px}.online{display:flex;gap:8px;align-items:center;margin-bottom:8px}.dot{width:7px;height:7px;border-radius:50%;background:#46e59c;box-shadow:0 0 16px #46e59c}
main{margin-left:270px;padding:40px 42px 80px;max-width:1500px}.hero{min-height:390px;padding:54px;display:flex;align-items:center;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:32px;background:linear-gradient(120deg,#7c5cff20,#29d8ff08 50%,#fff003);box-shadow:0 30px 100px #0008}.hero:after{content:"";position:absolute;width:440px;height:440px;right:-120px;top:-160px;border-radius:50%;background:radial-gradient(circle,#7c5cff70,transparent 68%);animation:float 7s ease-in-out infinite}.kicker{color:var(--b);font-size:11px;font-weight:900;letter-spacing:.28em}.hero h1{font-size:clamp(52px,7vw,94px);line-height:.88;letter-spacing:-.07em;margin:15px 0;background:linear-gradient(100deg,#fff,#aaa0ff 55%,#5feaff);-webkit-background-clip:text;color:transparent}.hero p{max-width:610px;color:#a2a8b9;line-height:1.7;font-size:16px}.actions{display:flex;gap:10px;margin-top:24px}.actions button{border-radius:13px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{border:0;color:#fff;background:linear-gradient(135deg,var(--a),#4d8fff);box-shadow:0 12px 32px #7c5cff44}.ghost{border:1px solid var(--line);color:#fff;background:#ffffff08}.head{display:flex;justify-content:space-between;align-items:end;margin:45px 3px 18px}.head h2{margin:0;font-size:27px}.head p{margin:6px 0 0;color:var(--muted)}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.card{position:relative;overflow:hidden;min-height:245px;padding:22px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#121522,#080a0f);cursor:pointer;animation:rise .7s both;transition:.35s}.card:hover{transform:translateY(-8px) scale(1.01);border-color:#7c5cff70;box-shadow:0 25px 75px #000a}.card:before{content:"";position:absolute;right:-70px;top:-70px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#7c5cff66,transparent 68%);transition:.4s}.card:hover:before{transform:scale(1.5)}.icon{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,var(--a),var(--b));font-weight:950;font-size:21px;box-shadow:0 12px 30px #7c5cff44}.tags{display:flex;gap:7px;margin:16px 0 10px}.tag{font-size:9px;font-weight:900;letter-spacing:.1em;padding:5px 8px;border-radius:7px;border:1px solid var(--line);color:#a5acc0;background:#fff0008}.card h3{margin:0;font-size:21px}.card p{color:#858c9f;font-size:13px;line-height:1.55;min-height:40px}.play{position:absolute;right:20px;bottom:20px;border:0;border-radius:11px;padding:9px 13px;background:#fff;color:#08090d;font-weight:900;cursor:pointer}.player{display:none;margin-top:34px;padding:14px;border:1px solid var(--line);border-radius:28px;background:#07080c;box-shadow:0 30px 90px #000b;animation:in .45s both}.player.open{display:block}.ptop{display:flex;justify-content:space-between;align-items:center;padding:4px 5px 12px}.ptop h2{margin:0;font-size:17px}.close{border:1px solid var(--line);background:#ffffff08;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}.frame{height:min(72vh,720px);border-radius:19px;overflow:hidden;background:#000}.frame iframe{width:100%;height:100%;border:0}.empty{padding:80px;text-align:center;color:#70788c}@keyframes rise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}@keyframes in{from{opacity:0;transform:translateY(15px) scale(.98)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(25px) scale(1.08)}}@media(max-width:850px){.sidebar{position:sticky;left:10px;right:10px;top:10px;bottom:auto;width:auto;height:auto;margin:10px;padding:10px;border-radius:18px}.brand{display:inline-block;padding:8px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.sidefoot{display:none}main{margin:0;padding:14px}.hero{padding:30px;min-height:360px}.hero h1{font-size:55px}}
</style></head><body>
<aside class="sidebar"><div class="brand">STELL<span>ARIO</span></div><div class="nav"><button class="active" onclick="go('home')">Home</button><button onclick="go('games')">Games</button><button onclick="go('player')">Player</button></div><div class="sidefoot"><div class="online"><span class="dot"></span>SYSTEM ONLINE</div>STELLARIO GAME HUB</div></aside>
<main id="home"><section class="hero"><div><div class="kicker">STELLARIO / GAME HUB</div><h1>PLAY.<br>DISCOVER.</h1><p>A polished space for your games. Choose a title, launch its embedded player, and jump straight into the experience.</p><div class="actions"><button class="primary" onclick="go('games')">Explore games</button><button class="ghost" onclick="firstGame()">Launch latest</button></div></div></section>
<div class="head" id="games"><div><h2>Game library</h2><p>Every game gets its own animated card and embedded player.</p></div></div><div class="games" id="grid"></div>
<section class="player" id="player"><div class="ptop"><h2 id="title">Player</h2><button class="close" onclick="closePlayer()">Close</button></div><div class="frame" id="frame"></div></section></main>
<script>
let games=[];const grid=document.getElementById('grid');
async function load(){try{games=(await (await fetch('./data/games.json')).json()).games||[]}catch(e){}render()}
function render(){grid.innerHTML=games.length?games.map((g,i)=>'<article class="card" style="animation-delay:'+i*90+'ms" onclick="openGame(\''+safe(g.id)+'\')"><div class="icon">'+safe((g.name||'G')[0].toUpperCase())+'</div><div class="tags">'+(g.tags||[]).map(t=>'<span class="tag">'+safe(t)+'</span>').join('')+'</div><h3>'+safe(g.name)+'</h3><p>'+safe(g.description||'Play now.')+'</p><button class="play">PLAY</button></article>').join(''):'<div class="empty">No games configured yet.</div>'}
function openGame(id){const g=games.find(x=>x.id===id);if(!g)return;document.getElementById('title').textContent=g.name;const f=document.getElementById('frame');f.innerHTML='';const i=document.createElement('iframe');i.src=g.embed||g.url;i.allow='fullscreen; autoplay; gamepad';i.allowFullscreen=true;f.appendChild(i);document.getElementById('player').classList.add('open');setTimeout(()=>go('player'),40)}
function closePlayer(){document.getElementById('player').classList.remove('open');document.getElementById('frame').innerHTML=''}
function firstGame(){if(games[0])openGame(games[0].id)}
function go(id){document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'})}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();
</script></body></html>
