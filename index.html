<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stellerio AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05050a;color:white;font-family:Inter,system-ui;min-height:100vh;overflow:hidden}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,#5b21ff55,transparent 35%),radial-gradient(circle at 80% 70%,#00d9ff33,transparent 35%)}.app{position:relative;display:flex;height:100vh}.chat{flex:1;padding:40px;display:flex;flex-direction:column}.title{font-size:60px;font-weight:900;background:linear-gradient(90deg,#fff,#8b5cf6,#22d3ee);color:transparent;background-clip:text}.messages{flex:1;overflow:auto;padding:20px 0}.msg{padding:15px;border-radius:18px;margin:12px 0;background:#ffffff10;border:1px solid #ffffff15}.input{display:flex;gap:10px}.input input{flex:1;padding:18px;border-radius:18px;background:#111;color:white;border:1px solid #ffffff22}.input button{padding:18px 28px;border-radius:18px;background:white;border:0}.cat{width:330px;display:flex;align-items:center;justify-content:center}.catbox{width:220px;height:220px;border-radius:50%;background:#ffffff10;border:1px solid #ffffff20;display:flex;align-items:center;justify-content:center;font-size:100px;animation:float 3s infinite}.eyes{animation:blink 5s infinite}@keyframes float{50%{transform:translateY(-15px)}}@keyframes blink{0%,90%,100%{opacity:1}95%{opacity:.2}}
</style></head>
<body><div class="app"><main class="chat"><div class="title">ASTRA AI</div><div class="messages" id="messages"><div class="msg">Astra online. Ask me to search, open documents, or run browser actions.</div></div><div class="input"><input id="input" placeholder="Ask Astra..."/><button onclick="send()">Send</button></div></main><aside class="cat"><div class="catbox"><span class="eyes">🐱</span></div></aside></div>
<script>
const box=document.getElementById('messages');function add(t){box.innerHTML+=`<div class="msg">${t}</div>`;box.scrollTop=box.scrollHeight}
async function send(){let v=document.getElementById('input').value;if(!v)return;add('You: '+v);document.getElementById('input').value='';if(v.toLowerCase().includes('search')){add('Browser search action requested. Connect Astra browser extension to enable live control.')}else if(v.toLowerCase().includes('open document')){add('Document automation requested. Connect Astra extension to type and edit files.')}else{add('Astra: AI backend connection ready. Add your local model endpoint in /api/chat.')}}
</script></body></html>
