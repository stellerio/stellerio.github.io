<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STELLARIO</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050507;color:white;font-family:Inter,system-ui;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-50%;background:radial-gradient(circle,#ffffff22,transparent 30%),radial-gradient(circle,#7c3cff44,transparent 35%),radial-gradient(circle,#00d9ff33,transparent 40%);animation:bg 15s infinite alternate;z-index:-1}
.container{text-align:center;padding:70px 25px}.title{font-size:clamp(80px,15vw,220px);font-weight:1000;letter-spacing:20px;background:linear-gradient(90deg,#fff,#aaa,#fff,#777,#fff);background-size:300%;background-clip:text;color:transparent;animation:shine 6s infinite linear,float 4s infinite ease-in-out}
.subtitle{font-size:24px;color:#bbb}
.games{margin-top:80px;display:flex;justify-content:center;gap:30px;flex-wrap:wrap}.game{width:320px;height:220px;padding:25px;border-radius:30px;background:#ffffff10;border:1px solid #ffffff20;backdrop-filter:blur(25px);animation:card 5s infinite}.game:hover{transform:scale(1.05)}
.preview{height:100px;border-radius:20px;background:#0008;margin-bottom:20px;display:flex;align-items:center;justify-content:center;color:#777}
.play{padding:12px 35px;border-radius:50px;border:0;font-weight:bold;cursor:pointer}
@keyframes shine{to{background-position:300%}}@keyframes float{50%{transform:translateY(-15px)}}@keyframes bg{to{transform:scale(1.2) rotate(10deg)}}@keyframes card{50%{translate:0 -8px}}
</style>
</head>
<body>
<div class="container">
<h1 class="title">STELLARIO</h1>
<p class="subtitle">Play your favorite games in one place.</p>
<div class="games">
<div class="game"><div class="preview">GAME EMBED</div><h2>Game One</h2><button class="play">PLAY</button></div>
<div class="game"><div class="preview">GAME EMBED</div><h2>Game Two</h2><button class="play">PLAY</button></div>
<div class="game"><div class="preview">GAME EMBED</div><h2>Game Three</h2><button class="play">PLAY</button></div>
</div>
</div>
</body>
</html>
