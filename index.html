<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Steller AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;width:100%;overflow:hidden}body{font-family:Inter,system-ui,sans-serif;background:#08090b;color:#ececf1}
:root{--bg:#08090b;--side:#101114;--line:#27282d;--muted:#9b9ca3;--text:#ececf1;--soft:#c9c9ce;--accent:#8b7cff}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.22;pointer-events:none}
#app{position:relative;z-index:2;height:100vh;display:flex;background:rgba(8,9,11,.94)}
.sidebar{width:260px;flex:none;background:rgba(16,17,20,.98);border-right:1px solid #25262a;display:flex;flex-direction:column;padding:12px;transition:width .2s}
.brand{height:46px;display:flex;align-items:center;gap:10px;padding:0 10px;margin-bottom:8px}.logo{width:29px;height:29px;border-radius:9px;background:linear-gradient(135deg,#7568ff,#bd69ff);display:grid;place-items:center;font-weight:800;box-shadow:0 0 20px #7568ff33}.brand b{font-family:'Space Grotesk';font-size:16px}.brand small{color:#777980;margin-left:4px;font-size:10px}
.newchat{width:100%;border:1px solid #303137;background:#191a1e;color:#eee;border-radius:10px;padding:10px 12px;text-align:left;font-size:13px;cursor:pointer;margin-bottom:12px}.newchat:hover{background:#222329}
.search{display:flex;align-items:center;gap:9px;color:#a7a8af;padding:10px 11px;border-radius:9px;font-size:12px;margin-bottom:14px}.search:hover{background:#1b1c20;color:#eee}
.history-title{font-size:10px;color:#686970;text-transform:uppercase;letter-spacing:.12em;padding:5px 10px 8px}.history{overflow:auto;flex:1}.history-item{width:100%;border:0;background:transparent;color:#aaaab1;text-align:left;padding:9px 10px;border-radius:8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.history-item:hover,.history-item.active{background:#1d1e22;color:#eee}.empty-history{padding:12px 10px;color:#5f6067;font-size:11px;line-height:1.5}
.side-bottom{border-top:1px solid #25262a;padding-top:10px;margin-top:10px}.side-btn{width:100%;border:0;background:transparent;color:#a6a7ae;text-align:left;padding:10px;border-radius:8px;font-size:12px;cursor:pointer}.side-btn:hover{background:#1c1d21;color:#fff}
.main{min-width:0;flex:1;height:100%;display:flex;flex-direction:column;position:relative}
.topbar{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid rgba(255,255,255,.055);background:rgba(8,9,11,.72);backdrop-filter:blur(18px)}.model{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600}.model-icon{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#7568ff,#bd69ff);display:grid;place-items:center;font-size:12px}.model small{display:block;color:#777980;font-size:10px;font-weight:400;margin-top:1px}.status{font-size:10px;color:#707178;display:flex;align-items:center;gap:7px}.status i{width:6px;height:6px;background:#5bd88b;border-radius:50%;box-shadow:0 0 8px #5bd88b88}
#chatbox{flex:1;overflow:auto;padding:30px 22px 150px;scrollbar-width:thin;scrollbar-color:#36373d transparent}.conversation{width:100%;max-width:820px;margin:0 auto}.welcome{min-height:calc(100vh - 230px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}.welcome-icon{width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,#7568ff,#bd69ff);display:grid;place-items:center;font-size:23px;box-shadow:0 0 35px #7568ff30;margin-bottom:18px}.welcome h1{font-family:'Space Grotesk';font-size:30px;letter-spacing:-.04em;margin-bottom:9px}.welcome p{color:#85868d;font-size:13px;max-width:440px;line-height:1.65}.prompts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:min(600px,100%);margin-top:25px}.prompt{border:1px solid #292a2f;background:#111216;color:#a9aab1;text-align:left;border-radius:12px;padding:13px;font-size:11px;cursor:pointer;transition:.18s}.prompt:hover{background:#18191d;border-color:#3a3b42;color:#eee;transform:translateY(-1px)}.prompt b{display:block;color:#ddd;font-size:12px;margin-bottom:3px}
.msg{display:flex;width:100%;margin:0 auto 26px;animation:in .25s ease both}.msg.user{justify-content:flex-end}.bubble{font-size:14px;line-height:1.72;word-break:break-word}.user .bubble{max-width:min(690px,80%);background:#25262a;border-radius:18px 18px 4px 18px;padding:11px 15px;color:#f0f0f2}.ai{justify-content:flex-start}.ai .bubble{max-width:760px;color:#dedee2}.meta{display:flex;align-items:center;gap:7px;font-size:10px;color:#85868d;margin-bottom:7px}.meta .mini{width:21px;height:21px;border-radius:6px;background:linear-gradient(135deg,#7568ff,#bd69ff);display:grid;place-items:center;color:#fff;font-size:9px}.bubble pre{background:#101115;border:1px solid #292a30;border-radius:10px;padding:13px;overflow:auto;margin:10px 0;font-size:12px}.bubble code{font-family:ui-monospace,SFMono-Regular,monospace;background:#1d1e23;border-radius:5px;padding:2px 5px;font-size:.9em}.bubble pre code{background:none;padding:0}.typing{display:flex;gap:4px;padding:5px 0}.typing i{width:5px;height:5px;border-radius:50%;background:#999;animation:blink 1.2s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes blink{50%{opacity:.25;transform:translateY(-2px)}}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.composer{position:absolute;bottom:0;left:0;right:0;padding:18px 20px 20px;background:linear-gradient(transparent,rgba(8,9,11,.94) 22%);z-index:5}.input-wrap{max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;background:#16171a;border:1px solid #33343a;border-radius:17px;padding:10px 11px 10px 15px;box-shadow:0 12px 35px #0008;transition:.2s}.input-wrap:focus-within{border-color:#55565f;box-shadow:0 0 0 3px #8b7cff0d,0 15px 40px #0009}textarea{flex:1;min-width:0;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:#f0f0f2;font:14px Inter;line-height:1.5}textarea::placeholder{color:#696a72}.send{width:35px;height:35px;border:0;border-radius:10px;background:#eee;color:#111;font-size:16px;cursor:pointer;flex:none}.send:hover{background:#fff}.send:disabled{opacity:.3;cursor:not-allowed}.composer-note{text-align:center;color:#5f6066;font-size:10px;margin-top:8px}
@media(max-width:720px){.sidebar{width:62px;padding:8px}.brand{padding:0;justify-content:center}.brand b,.brand small,.newchat,.search,.history-title,.history,.side-bottom{display:none}.main{width:calc(100% - 62px)}.topbar{padding:0 12px}.status{display:none}.prompts{grid-template-columns:1fr}.user .bubble{max-width:88%}.welcome h1{font-size:25px}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">S</div><div><b>Steller</b><small>AI</small></div></div>
  <button class="newchat" id="newChat">＋ New chat</button>
  <div class="search">⌕ <span>Search chats</span></div>
  <div class="history-title">History</div>
  <div class="history" id="history"><div class="empty-history" id="emptyHistory">Your conversations will appear here.</div></div>
  <div class="side-bottom"><button class="side-btn" id="clearHistory">⌫ Clear history</button></div>
</aside>
<main class="main">
  <div class="topbar"><div class="model"><div class="model-icon">✦</div><div>Steller<small>AI assistant</small></div></div><div class="status"><i></i>Online</div></div>
  <div id="chatbox"><div class="conversation" id="conversation"><div class="welcome" id="welcome"><div class="welcome-icon">✦</div><h1>What can I help with?</h1><p>Ask Steller anything. Start a conversation, work on code, brainstorm ideas, or just chat.</p><div class="prompts"><button class="prompt" data-prompt="Help me build a website"><b>Build a website</b>Turn an idea into a real project</button><button class="prompt" data-prompt="Explain something to me simply"><b>Explain something</b>Make a difficult topic easy</button><button class="prompt" data-prompt="Help me debug my code"><b>Debug my code</b>Find and fix a problem</button><button class="prompt" data-prompt="Give me some creative ideas"><b>Get creative</b>Brainstorm something new</button></div></div></div></div>
  <div class="composer"><div class="input-wrap"><textarea id="messageInput" rows="1" placeholder="Message Steller..."></textarea><button class="send" id="sendBtn">↑</button></div><div class="composer-note">Steller can make mistakes. Check important information.</div></div>
</main>
</div>
<script>
/* subtle background only — kept intentionally dim so it does not distract from chat */
const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d');let stars=[],mx=0,my=0;
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;stars=Array.from({length:90},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.3+Math.random()*.8,p:Math.random()*6.28}))}function draw(t){ctx.clearRect(0,0,innerWidth,innerHeight);for(const s of stars){ctx.globalAlpha=.08+.07*(.5+.5*Math.sin(t*.001+s.p));ctx.fillStyle='#c9c5ff';ctx.beginPath();ctx.arc(s.x+(mx-innerWidth/2)*.004,s.y+(my-innerHeight/2)*.004,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(draw)}addEventListener('resize',resize);addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});resize();requestAnimationFrame(draw);

const box=document.getElementById('conversation'),chatbox=document.getElementById('chatbox'),input=document.getElementById('messageInput'),sendBtn=document.getElementById('sendBtn'),welcome=document.getElementById('welcome'),historyEl=document.getElementById('history'),emptyHistory=document.getElementById('emptyHistory');
let receiving=false;
let chatId=crypto.randomUUID();
let currentMessages=[];
const SYSTEM=`You are Steller, a helpful, natural, conversational AI assistant. Be clear, useful, casual when appropriate, and adapt to the user's tone. Give strong answers, explain things when needed, and help with coding, ideas, writing, learning, and everyday questions. Do not claim to be human. Keep responses natural and avoid unnecessary filler.`;

function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function formatText(s){return escapeHtml(s).replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>')}
function addUserMsg(text,save=true){if(welcome&&welcome.parentNode)welcome.remove();const row=document.createElement('div');row.className='msg user';const bub=document.createElement('div');bub.className='bubble';bub.textContent=text;row.appendChild(bub);box.appendChild(row);if(save)currentMessages.push({role:'user',content:text});scrollBottom()}
function addBotMsg(text,save=true){if(welcome&&welcome.parentNode)welcome.remove();const row=document.createElement('div');row.className='msg ai';const bub=document.createElement('div');bub.className='bubble';bub.innerHTML='<div class="meta"><span class="mini">S</span> Steller</div>'+formatText(text);row.appendChild(bub);box.appendChild(row);if(save)currentMessages.push({role:'assistant',content:text});scrollBottom()}
function showTyping(){const row=document.createElement('div');row.className='msg ai';row.id='typingRow';const bub=document.createElement('div');bub.className='bubble';bub.innerHTML='<div class="meta"><span class="mini">S</span> Steller</div><div class="typing"><i></i><i></i><i></i></div>';row.appendChild(bub);box.appendChild(row);scrollBottom()}
function hideTyping(){const x=document.getElementById('typingRow');if(x)x.remove()}
function scrollBottom(){requestAnimationFrame(()=>chatbox.scrollTop=chatbox.scrollHeight)}

function saveCurrent(){if(!currentMessages.length)return;let title=currentMessages.find(x=>x.role==='user')?.content||'New conversation';title=title.length>34?title.slice(0,34)+'…':title;const item={id:chatId,title,messages:currentMessages};let all=JSON.parse(localStorage.getItem('steller_history')||'[]');all=all.filter(x=>x.id!==chatId);all.unshift(item);localStorage.setItem('steller_history',JSON.stringify(all.slice(0,30)));renderHistory()}
function renderHistory(){const all=JSON.parse(localStorage.getItem('steller_history')||'[]');historyEl.innerHTML='';if(!all.length){historyEl.appendChild(Object.assign(document.createElement('div'),{className:'empty-history',textContent:'Your conversations will appear here.'}));return}all.forEach(item=>{const b=document.createElement('button');b.className='history-item'+(item.id===chatId?' active':'');b.textContent=item.title;b.onclick=()=>loadChat(item);historyEl.appendChild(b)})}
function loadChat(item){chatId=item.id;currentMessages=item.messages||[];box.innerHTML='';currentMessages.forEach(m=>{if(m.role==='user')addUserMsg(m.content,false);else addBotMsg(m.content,false)});renderHistory();scrollBottom()}
function newChat(){saveCurrent();chatId=crypto.randomUUID();currentMessages=[];box.innerHTML='<div class="welcome" id="welcome"><div class="welcome-icon">✦</div><h1>What can I help with?</h1><p>Ask Steller anything. Start a conversation, work on code, brainstorm ideas, or just chat.</p><div class="prompts"><button class="prompt" data-prompt="Help me build a website"><b>Build a website</b>Turn an idea into a real project</button><button class="prompt" data-prompt="Explain something to me simply"><b>Explain something</b>Make a difficult topic easy</button><button class="prompt" data-prompt="Help me debug my code"><b>Debug my code</b>Find and fix a problem</button><button class="prompt" data-prompt="Give me some creative ideas"><b>Get creative</b>Brainstorm something new</button></div></div>';bindPrompts();renderHistory();input.focus()}

function wsSend(message){receiving=true;sendBtn.disabled=true;showTyping();const ws=new WebSocket('wss://backend.buildpicoapps.com/api/chatbot/chat');let started=false;let text='';let textSpan=null;
ws.addEventListener('open',()=>{ws.send(JSON.stringify({chatId:chatId,appId:'stay-father',systemPrompt:SYSTEM,message:message}))});
ws.addEventListener('message',event=>{let data;try{data=JSON.parse(event.data)}catch{data={text:event.data}};let chunk=data.text||data.message||data.content||'';if(typeof chunk!=='string')return;if(!started){started=true;hideTyping();const row=document.createElement('div');row.className='msg ai';const bub=document.createElement('div');bub.className='bubble';bub.innerHTML='<div class="meta"><span class="mini">S</span> Steller</div>';textSpan=document.createElement('div');bub.appendChild(textSpan);row.appendChild(bub);box.appendChild(row)}text+=chunk;textSpan.innerHTML=formatText(text);scrollBottom()});
ws.addEventListener('close',()=>{if(!started){hideTyping();addBotMsg('Something went wrong. Try sending that again.')}else{currentMessages.push({role:'assistant',content:text});saveCurrent()}receiving=false;sendBtn.disabled=false});
ws.addEventListener('error',()=>{hideTyping();if(!started)addBotMsg('Something went wrong. Try sending that again.');receiving=false;sendBtn.disabled=false});}
function sendMessage(){if(receiving)return;const text=input.value.trim();if(!text)return;addUserMsg(text);input.value='';input.style.height='auto';wsSend(text)}
function bindPrompts(){document.querySelectorAll('.prompt').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;sendMessage()})}
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});sendBtn.onclick=sendMessage;document.getElementById('newChat').onclick=newChat;document.getElementById('clearHistory').onclick=()=>{localStorage.removeItem('steller_history');renderHistory()};bindPrompts();renderHistory();input.focus();
</script>
</body>
</html>
