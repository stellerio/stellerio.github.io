<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADUIOX</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#030308;color:white;font-family:Inter,system-ui;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-50%;background:radial-gradient(circle,#7c3cff55,transparent 35%),radial-gradient(circle,#00eaff44,transparent 35%);animation:bg 12s infinite alternate}
.page{position:relative;z-index:1;text-align:center;padding:80px 20px}.logo{font-size:clamp(80px,16vw,220px);font-weight:1000;letter-spacing:25px;background:linear-gradient(90deg,#fff,#8b5cf6,#00eaff,#fff);background-size:300%;background-clip:text;color:transparent;animation:shine 5s linear infinite,float 3s infinite ease-in-out}
.sub{font-size:24px;color:#aaa}.download{margin-top:45px;padding:20px 55px;border:0;border-radius:50px;font-size:20px;font-weight:700;cursor:pointer;transition:.4s}.download:hover{transform:scale(1.12);box-shadow:0 0 50px #00eaff}
.cards{display:flex;justify-content:center;gap:25px;flex-wrap:wrap;margin-top:100px}.card{width:280px;padding:35px;border-radius:25px;background:#ffffff12;border:1px solid #ffffff20;backdrop-filter:blur(20px);animation:float 4s infinite}.card:hover{transform:translateY(-15px)}
@keyframes shine{to{background-position:300%}}@keyframes float{50%{transform:translateY(-15px)}}@keyframes bg{to{transform:scale(1.3) rotate(10deg)}}
</style>
</head>
<body>
<div class="page">
<h1 class="logo">ADUIOX</h1>
<p class="sub">The next generation audio experience.</p>
<button class="download">Download ADUIOX</button>
<div class="cards">
<div class="card"><h2>Premium Audio</h2><p>Crystal clear sound with a modern experience.</p></div>
<div class="card"><h2>Fast</h2><p>Built for smooth performance everywhere.</p></div>
<div class="card"><h2>Beautiful</h2><p>A futuristic interface designed to stand out.</p></div>
</div>
</div>
</body>
</html>
