<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stellerio — Games & Experiments</title>
<meta name="description" content="Stellerio — a polished animated hub for games, projects and experiments.">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--bg:#06070b;--panel:rgba(15,17,25,.72);--line:rgba(255,255,255,.09);--text:#f7f7fb;--muted:#8b90a2;--a:#8b7cff;--b:#48d9ff;--c:#ff78c8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}.font-display{font-family:'Space Grotesk',sans-serif}.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 25px 90px rgba(0,0,0,.28)}.gradient-text{background:linear-gradient(100deg,#fff 10%,#a99dff 38%,#52dcff 67%,#ff82ca 95%);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:220% auto;animation:gradient 6s linear infinite}.grid-bg{background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:55px 55px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}.glow{box-shadow:0 0 80px rgba(139,124,255,.13)}.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}@keyframes gradient{to{background-position:220% center}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes pulse{50%{opacity:.45;transform:scale(1.35)}}@keyframes spin{to{transform:rotate(360deg)}}.float{animation:float 5s ease-in-out infinite}.orb{animation:float 6s ease-in-out infinite}.pulse{animation:pulse 2s ease-in-out infinite}.spin{animation:spin 22s linear infinite}.reduced *{animation:none!important;transition:none!important;scroll-behavior:auto!important}.cursorGlow{position:fixed;width:280px;height:280px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(139,124,255,.11),transparent 68%);transform:translate(-50%,-50%);mix-blend-mode:screen}.sidebar{transition:width .35s ease}.game-card{transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .45s}.game-card:hover{transform:translateY(-8px) rotateX(2deg);border-color:rgba(139,124,255,.38);box-shadow:0 30px 80px rgba(0,0,0,.38),0 0 45px rgba(139,124,255,.08)}.icon-btn{transition:.25s}.icon-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.1)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useEffect,useMemo,useRef,useState}=React;
const icons={home:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10Z"/><path d="M9 21v-7h6v7"/></svg>,games:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="6" width="18" height="13" rx="4"/><path d="M7 12h4M9 10v4M15.5 11.5h.01M18 14h.01"/></svg>,settings:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 1 1-2.4-2.4l.1-.1A1.7 1.7 0 0 0 6.2 12a1.7 1.7 0 0 0-1.2-2.9h-.2a1.7 1.7 0 0 1 0-3.4H5a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 1 1 2.4-2.4l.1.1A1.7 1.7 0 0 0 11.5 1v-.2a1.7 1.7 0 0 1 3.4 0V1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 1 1 2.4 2.4l-.1.1A1.7 1.7 0 0 0 21.4 7v.2a1.7 1.7 0 0 1 0 3.4h-.2A1.7 1.7 0 0 0 20 13a1.7 1.7 0 0 0-.6 2Z"/></svg>,arrow:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M5 12h13M13 6l6 6-6 6"/></svg>,spark:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7"><path d="m12 2 1.5 6.5L20 10l-6.5 1.5L12 18l-1.5-6.5L4 10l6.5-1.5L12 2Z"/><path d="m19 16 .6 2.4L22 19l-2.4.6L19 22l-.6-2.4L16 19l2.4-.6L19 16Z"/></svg>,github:<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .7a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.8.1-.8.1-.8 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.4-5.5-6a4.7 4.7 0 0 1 1.2-3.3c-.1-.3-.5-1.6.1-3.3 0 0 1-.3 3.4 1.2a11.6 11.6 0 0 1 6.2 0C17.9 4.8 19 5 19 5c.6 1.7.2 3 .1 3.3a4.7 4.7 0 0 1 1.2 3.3c0 4.6-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .7Z"/></svg>};
function Icon({name,className='w-5 h-5'}){return <span className={'inline-flex '+className}>{icons[name]}</span>}
function Scene(){const ref=useRef();useEffect(()=>{const el=ref.current,s=new THREE.Scene(),c=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);c.position.z=4.7;const r=new THREE.WebGLRenderer({alpha:true,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.6));r.setSize(innerWidth,innerHeight);el.appendChild(r.domElement);const geo=new THREE.IcosahedronGeometry(1.35,2),mat=new THREE.MeshBasicMaterial({color:0x8b7cff,wireframe:true,transparent:true,opacity:.13});const mesh=new THREE.Mesh(geo,mat);s.add(mesh);const pGeo=new THREE.BufferGeometry(),pts=[];for(let i=0;i<420;i++){pts.push((Math.random()-.5)*13,(Math.random()-.5)*8,(Math.random()-.5)*7)}pGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));const p=new THREE.Points(pGeo,new THREE.PointsMaterial({color:0xffffff,size:.018,transparent:true,opacity:.55}));s.add(p);let mx=0,my=0;const move=e=>{mx=(e.clientX/innerWidth-.5)*.35;my=(e.clientY/innerHeight-.5)*.2};addEventListener('pointermove',move);const tick=()=>{mesh.rotation.x+=.0015;mesh.rotation.y+=.0022;mesh.position.x+=(mx-mesh.position.x)*.025;mesh.position.y+=(-my-mesh.position.y)*.025;p.rotation.y+=.00035;r.render(s,c);requestAnimationFrame(tick)};tick();const resize=()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};addEventListener('resize',resize);return()=>{removeEventListener('resize',resize);removeEventListener('pointermove',move);r.dispose();el.innerHTML=''}},[]);return <div ref={ref} className="fixed inset-0 pointer-events-none opacity-80 z-0"/>}
function App(){const [page,setPage]=useState('home'),[games,setGames]=useState([]),[query,setQuery]=useState(''),[reduced,setReduced]=useState(false),[clock,setClock]=useState(new Date()),[sidebar,setSidebar]=useState(true),[loaded,setLoaded]=useState(false);useEffect(()=>{fetch('./data/games.json',{cache:'no-store'}).then(r=>r.json()).then(x=>setGames(x.games||[])).catch(()=>setGames([])).finally(()=>setLoaded(true))},[]);useEffect(()=>{const t=setInterval(()=>setClock(new Date()),1000);return()=>clearInterval(t)},[]);useEffect(()=>{document.body.classList.toggle('reduced',reduced)},[reduced]);useEffect(()=>{gsap.registerPlugin(ScrollTrigger);gsap.from('.heroPiece',{opacity:0,y:30,duration:1,stagger:.09,ease:'power3.out'});gsap.utils.toArray('.reveal').forEach(x=>gsap.fromTo(x,{opacity:0,y:35},{opacity:1,y:0,duration:.8,ease:'power3.out',scrollTrigger:{trigger:x,start:'top 88%'}}))},[page]);const filtered=useMemo(()=>games.filter(g=>(g.name+' '+g.description+' '+g.tags.join(' ')).toLowerCase().includes(query.toLowerCase())),[games,query]);const nav=(p)=>{setPage(p);window.scrollTo({top:0,behavior:'smooth'})};return <><Scene/><div className="grid-bg fixed inset-0 z-0 pointer-events-none"/><div className="cursorGlow" id="cursorGlow"/><div className="relative z-10 min-h-screen flex">
<aside className={'sidebar fixed md:sticky top-0 h-screen z-30 '+(sidebar?'w-[250px]':'w-[78px]')+' hidden md:flex flex-col p-4'}><div className="glass rounded-3xl h-full p-3 flex flex-col"><div className="flex items-center gap-3 px-2 py-3 mb-6"><div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-violet-400 via-blue-400 to-pink-400 grid place-items-center text-black font-bold shadow-lg shadow-violet-500/20">S</div>{sidebar&&<div><div className="font-display font-bold tracking-tight">Stellerio</div><div className="text-[10px] text-zinc-500">GAME HUB</div></div>}</div><div className="space-y-1">{[['home','Home'],['games','Games']].map(([id,label])=><button key={id} onClick={()=>nav(id)} className={'w-full flex items-center gap-3 rounded-2xl px-3 py-3 text-sm '+(page===id?'bg-white/10 text-white':'text-zinc-500 hover:text-white hover:bg-white/5')}><Icon name={id}/>{sidebar&&label}</button>)}</div><div className="mt-auto space-y-1"><button onClick={()=>setReduced(!reduced)} className="w-full flex items-center gap-3 rounded-2xl px-3 py-3 text-sm text-zinc-500 hover:text-white hover:bg-white/5"><Icon name="settings"/>{sidebar&&'Motion: '+(reduced?'Low':'Full')}</button><button onClick={()=>setSidebar(!sidebar)} className="w-full rounded-2xl px-3 py-3 text-xs text-zinc-600 hover:text-white hover:bg-white/5">{sidebar?'Collapse sidebar':'Expand sidebar'}</button></div></div></aside>
<main className="w-full min-w-0"><header className="sticky top-3 z-20 px-4 md:px-7"><div className="glass max-w-6xl mx-auto rounded-2xl px-4 py-3 flex items-center gap-3"><button className="md:hidden icon-btn p-2 rounded-xl text-zinc-400" onClick={()=>setSidebar(!sidebar)}><Icon name="games"/></button><button onClick={()=>nav('home')} className="font-display font-bold tracking-tight">STELLERIO<span className="text-violet-400">.</span></button><div className="hidden sm:flex ml-auto items-center gap-1 text-xs text-zinc-500"><button onClick={()=>nav('home')} className="px-3 py-2 rounded-xl hover:bg-white/5 hover:text-white">Home</button><button onClick={()=>nav('games')} className="px-3 py-2 rounded-xl hover:bg-white/5 hover:text-white">Games</button><button onClick={()=>document.getElementById('settings').showModal()} className="px-3 py-2 rounded-xl hover:bg-white/5 hover:text-white">Settings</button></div><div className="hidden sm:flex items-center gap-2 pl-3 border-l border-white/10 text-[11px] text-zinc-500"><span className="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse"/>Online</div></div></header>
{page==='home'?<Home games={games} nav={nav} clock={clock}/>:<Games games={filtered} query={query} setQuery={setQuery} loaded={loaded} nav={nav}/>}<Settings reduced={reduced} setReduced={setReduced} clock={clock}/><footer className="max-w-6xl mx-auto px-6 py-14 text-xs text-zinc-600 flex justify-between gap-4"><span>STELLERIO · BUILT FOR GAMES & EXPERIMENTS</span><span>{clock.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></footer></main></div></>}
function Home({games,nav,clock}){return <><section className="min-h-[760px] max-w-6xl mx-auto px-6 flex items-center pt-24"><div className="max-w-4xl"><div className="heroPiece inline-flex items-center gap-2 glass rounded-full px-3 py-2 text-[10px] uppercase tracking-[.18em] text-zinc-400"><span className="w-1.5 h-1.5 rounded-full bg-violet-400 pulse"/> STELLERIO / DIGITAL PLAYGROUND</div><h1 className="heroPiece font-display text-6xl sm:text-8xl md:text-[120px] leading-[.86] tracking-[-.08em] font-bold mt-7">Play.<br/><span className="gradient-text">Explore.</span><br/>Create.</h1><p className="heroPiece max-w-2xl text-zinc-400 text-base md:text-lg leading-7 mt-8">A clean home for games, experiments and projects. Everything is designed to feel alive without throwing a thousand things at you at once.</p><div className="heroPiece flex flex-wrap gap-3 mt-8"><button onClick={()=>nav('games')} className="group rounded-2xl bg-white text-black px-5 py-3 text-sm font-bold hover:-translate-y-1 transition">Explore games <span className="inline-block group-hover:translate-x-1 transition">→</span></button><button onClick={()=>document.getElementById('features').scrollIntoView({behavior:'smooth'})} className="rounded-2xl glass px-5 py-3 text-sm text-zinc-300 hover:bg-white/10 transition">See features</button></div><div className="heroPiece flex gap-8 mt-14 text-xs text-zinc-600"><span><b className="text-zinc-300 font-display text-xl block">{games.length}</b>games ready</span><span><b className="text-zinc-300 font-display text-xl block">100%</b>static hosting</span><span><b className="text-zinc-300 font-display text-xl block">24/7</b>available</span></div></div><div className="absolute right-[13%] top-[28%] w-40 h-40 rounded-full border border-violet-400/10 spin hidden lg:block"/></section><section id="features" className="max-w-6xl mx-auto px-6 py-24"><div className="reveal mb-10"><div className="text-[10px] uppercase tracking-[.2em] text-violet-300">01 / System</div><h2 className="font-display text-4xl md:text-6xl tracking-tight mt-2">A lot going on.<br/><span className="text-zinc-600">Nothing feels messy.</span></h2></div><div className="grid md:grid-cols-3 gap-3"><Feature icon="spark" title="Living UI" text="Layered gradients, particles, depth and motion make the interface feel responsive instead of flat."/><Feature icon="games" title="Game library" text="Games live in one tiny data file. Add a name, description, tags and GitHub link when you're ready."/><Feature icon="settings" title="Your settings" text="Control motion, scrolling behavior and the site experience without leaving the page."/></div></section><section className="max-w-6xl mx-auto px-6 py-20"><div className="reveal glass rounded-[32px] p-7 md:p-10 overflow-hidden relative"><div className="absolute -right-24 -top-24 w-72 h-72 rounded-full bg-violet-500/10 blur-3xl"/><div className="relative flex flex-col md:flex-row md:items-end justify-between gap-7"><div><div className="text-[10px] uppercase tracking-[.2em] text-cyan-300">02 / Games</div><h2 className="font-display text-4xl md:text-5xl mt-2">Ready when you are.</h2><p className="text-zinc-500 max-w-xl mt-3">The library is intentionally empty-friendly. Blank GitHub links stay disabled until you add the real project.</p></div><button onClick={()=>nav('games')} className="rounded-2xl bg-white text-black px-5 py-3 text-sm font-bold">Open library →</button></div><div className="grid sm:grid-cols-3 gap-3 mt-9">{games.slice(0,3).map((g,i)=><GameCard key={g.id||i} g={g} nav={nav}/>)}</div></div></section></>}
function Feature({icon,title,text}){return <div className="reveal glass rounded-3xl p-6 min-h-52 hover:bg-white/[.06] transition"><div className="w-10 h-10 rounded-2xl bg-white/5 grid place-items-center text-violet-300"><Icon name={icon}/></div><h3 className="font-display font-bold text-xl mt-8">{title}</h3><p className="text-sm text-zinc-500 leading-6 mt-2">{text}</p></div>}
function Games({games,query,setQuery,loaded,nav}){return <section className="max-w-6xl mx-auto px-6 pt-32 pb-20"><div className="reveal flex flex-col md:flex-row md:items-end justify-between gap-7"><div><div className="text-[10px] uppercase tracking-[.2em] text-violet-300">03 / Library</div><h1 className="font-display text-6xl md:text-8xl tracking-[-.06em] mt-2">Games<span className="gradient-text">.</span></h1><p className="text-zinc-500 mt-4 max-w-xl">A simple GitHub-powered shelf. Add games through <code className="text-zinc-300">data/games.json</code> and they appear here automatically.</p></div><div className="relative w-full md:w-72"><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search games..." className="w-full glass rounded-2xl px-4 py-3 outline-none text-sm text-white placeholder:text-zinc-600 focus:border-violet-400/40"/></div></div><div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-12">{!loaded?[1,2,3].map(i=><div key={i} className="glass rounded-3xl h-64 animate-pulse"/>):games.length?games.map(g=><GameCard key={g.id} g={g} nav={nav}/>):<div className="col-span-full glass rounded-3xl p-12 text-center"><div className="font-display text-2xl">No games yet</div><p className="text-zinc-600 mt-2">Add one to data/games.json and it will show up here.</p></div>}</div></section>}
function GameCard({g,nav}){const ready=Boolean(g.github);return <article className="game-card glass rounded-3xl p-5 min-h-64 flex flex-col overflow-hidden relative"><div className="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-violet-400/70 to-transparent opacity-0 group-hover:opacity-100"/><div className="flex items-start justify-between"><div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-white/10 to-white/[.02] border border-white/10 grid place-items-center text-violet-300 font-display font-bold">{(g.name||'G')[0]}</div><span className={'text-[9px] uppercase tracking-[.15em] rounded-full px-2 py-1 border '+(ready?'text-emerald-300 border-emerald-400/20 bg-emerald-400/5':'text-zinc-600 border-white/10')}>{ready?'Ready':'Link pending'}</span></div><div className="mt-auto pt-12"><div className="flex gap-2 flex-wrap">{(g.tags||[]).map(t=><span key={t} className="text-[9px] text-zinc-500 border border-white/8 rounded-full px-2 py-1">{t}</span>)}</div><h3 className="font-display font-bold text-2xl mt-3">{g.name}</h3><p className="text-xs text-zinc-500 leading-5 mt-2">{g.description}</p><div className="flex items-center gap-2 mt-5">{ready?<a href={g.github} target="_blank" rel="noreferrer" className="rounded-xl bg-white text-black px-3 py-2 text-xs font-bold">Open GitHub <span>↗</span></a>:<button disabled className="rounded-xl bg-white/5 text-zinc-600 px-3 py-2 text-xs cursor-not-allowed">GitHub link not set</button>}<button onClick={()=>nav('home')} className="rounded-xl border border-white/10 px-3 py-2 text-xs text-zinc-400 hover:text-white hover:bg-white/5">Home</button></div></div></article>}
function Settings({reduced,setReduced,clock}){return <dialog id="settings" className="bg-transparent p-0 backdrop:bg-black/70"><div className="glass rounded-3xl p-6 w-[min(430px,calc(100vw-30px))] text-white"><div className="flex justify-between items-center"><div><div className="font-display text-xl font-bold">Stellerio settings</div><div className="text-xs text-zinc-500 mt-1">Small controls. No clutter.</div></div><button onClick={()=>document.getElementById('settings').close()} className="text-zinc-500 hover:text-white">✕</button></div><div className="mt-7 space-y-3"><div className="rounded-2xl bg-white/5 border border-white/5 p-4 flex justify-between items-center"><div><div className="text-sm">Reduced motion</div><div className="text-[11px] text-zinc-600">Disable most animated transitions</div></div><button onClick={()=>setReduced(!reduced)} className={'w-11 h-6 rounded-full p-1 transition '+(reduced?'bg-violet-400':'bg-white/10')}><span className={'block w-4 h-4 rounded-full bg-white transition '+(reduced?'translate-x-5':'')}/></button></div><div className="rounded-2xl bg-white/5 border border-white/5 p-4"><div className="text-sm">Web clock</div><div className="font-display text-3xl mt-2">{clock.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div><div className="text-[11px] text-zinc-600 mt-1">Local browser time</div></div></div></div></dialog>}
const root=ReactDOM.createRoot(document.getElementById('root'));root.render(<App/>);document.addEventListener('pointermove',e=>{const g=document.getElementById('cursorGlow');if(g){g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'}});
</script>
</body>
</html>
