<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STELLARIO v3</title>
<style>
body{margin:0;background:#000;color:white;font-family:Inter,Arial;text-align:center}.games{display:flex;gap:20px;justify-content:center;margin:40px}.game,button{padding:20px;border-radius:20px;background:#111;color:white;border:1px solid #444;cursor:pointer}.viewer{display:none;margin:30px auto;width:90%;height:650px}.viewer.active{display:block}iframe{width:100%;height:100%;border:0;border-radius:20px}
</style>
</head>
<body>
<h1>STELLARIO</h1>
<p>Your online gaming universe.</p>
<div class="games"><div class="game">Test 1</div><div class="game">Game Two</div><div class="game">Game Three</div></div>
<button onclick="openGame('Test 1')">Test 1</button>
<div id="viewer" class="viewer"></div>
<script>
function openGame(n){let v=document.getElementById('viewer');v.classList.add('active');if(n==='Test 1'){v.innerHTML='<iframe src="https://scratch.mit.edu/projects/571166814/embed"></iframe>'}else{v.innerHTML=n+' EMBED PLAYER'}}
</script>
</body>
</html>
