<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STELLARIO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:white;font-family:Inter,system-ui;overflow:hidden}
body:before{content:"";position:fixed;inset:-40%;background:radial-gradient(circle,#ffffff18,transparent 25%),radial-gradient(circle,#7773ff22,transparent 35%);animation:bg 18s infinite alternate;z-index:-1}
.app{height:100vh;display:flex}
.main{flex:1;padding:50px;text-align:center;overflow:auto}
.title{font-size:clamp(70px,13vw,180px);font-weight:1000;letter-spacing:18px;background:linear-gradient(90deg,#fff,#777,#eee,#444,#fff);background-size:400%;background-clip:text;color:transparent;animation:typing 3s steps(10),shine 7s infinite linear,float 4s infinite ease-in-out;white-space:nowrap;overflow:hidden}
.sub{color:#aaa;font-size:22px}
.sidebar{width:300px;background:#080808dd;border-left:1px solid #ffffff20;padding:30px;backdrop-filter:blur(20px)}
.sideTitle{font-size:24px;font-weight:800;margin-bottom:30px}
.gameBtn{width:100%;display:flex;gap:15px;align-items:center;padding:18px;margin:15px 0;border-radius:18px;background:#ffffff08;border:1px solid #ffffff15;color:white;cursor:pointer;transition:.3s}.gameBtn:hover{transform:translateX(-8px);background:#ffffff18}
svg{width:28px;height:28px;fill:none;stroke:white;stroke-width:2}
.viewer{display:none;margin:50px auto;width:90%;height:650px;border-radius:35px;background:#050505;border:1px solid #ffffff25;box-shadow:0 0 80px #ffffff15;align-items:center;justify-content:center;color:#777;font-size:30px;animation:open .6s}
.viewer.active{display:flex}
.cards{display:flex;justify-content:center;gap:25px;margin-top:70px}.card{padding:30px;border-radius:25px;background:#ffffff0d;border:1px solid #ffffff18}
@keyframes shine{to{background-position:400%}}@keyframes float{50%{transform:translateY(-12px)}}@keyframes bg{to{transform:scale(1.3)}}@keyframes open{from{transform:scale(.8);opacity:0}}
@keyframes typing{from{width:0}to{width:100%}}
</style></head>
<body>
<div class="app">
<main class="main">
<h1 class="title">STELLARIO</h1>
<p class="sub">The ultimate online gaming universe.</p>
<div id="viewer" class="viewer">Select a game to launch</div>
<div class="cards"><div class="card">🎮 Game Library</div><div class="card">⚡ Fast Loading</div><div class="card">✨ Premium UI</div></div>
</main>
<aside class="sidebar">
<div class="sideTitle">STELLARIO</div>
<button class="gameBtn" onclick="openGame('Game One')"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg>Game One</button>
<button class="gameBtn" onclick="openGame('Game Two')"><svg viewBox="0 0 24 24"><path d="M4 7h16v10H4z"/></svg>Game Two</button>
<button class="gameBtn" onclick="openGame('Game Three')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>Game Three</button>
</aside></div>
<script>function openGame(name){let v=document.getElementById('viewer');v.classList.add('active');v.innerHTML=name+' EMBED BOX (URL EMPTY)';}</script>
</body></html>
